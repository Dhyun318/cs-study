<svg xmlns="http://www.w3.org/2000/svg" width="390" height="660" viewBox="0 0 390 660" role="img" aria-labelledby="title desc"><title id="title">쿠키와 세션 로그인 흐름</title><desc id="desc">로그인 성공 시 서버 세션 저장소에 sid A1B2와 user 42 연결을 저장한다. 브라우저에는 Set-Cookie로 ID를 내려 주고 이후 Cookie 헤더로 보내면 서버가 세션을 조회한다. A1B2는 설명용이며 실제 ID는 예측 불가능하게 발급한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / SESSION</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">쿠키에는 ID, 정보는 서버에</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">세션도 쿠키를 이용해 사용자를 이어 줘요</text><rect x="24" y="117" width="124" height="46" rx="12" fill="#03257B" stroke="none"/><text x="86.0" y="145.0" font-size="16" fill="white" font-weight="600" text-anchor="middle">브라우저</text><rect x="242" y="117" width="124" height="46" rx="12" fill="#03257B" stroke="none"/><text x="304.0" y="145.0" font-size="16" fill="white" font-weight="600" text-anchor="middle">서버</text><path d="M66 202 L322 202" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="92" y="183" width="206" height="29" rx="8" fill="white" stroke="none"/><text x="195" y="203" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">로그인 ID · PW</text><circle cx="48" cy="202" r="12" fill="#0E5CF4"/><text x="48" y="206" font-size="12" fill="white" font-weight="600" text-anchor="middle">1</text><path d="M322 272 L66 272" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="92" y="253" width="206" height="29" rx="8" fill="white" stroke="none"/><text x="195" y="273" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">Set-Cookie: sid=A1B2</text><circle cx="48" cy="272" r="12" fill="#0E5CF4"/><text x="48" y="276" font-size="12" fill="white" font-weight="600" text-anchor="middle">2</text><path d="M66 342 L322 342" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="92" y="323" width="206" height="29" rx="8" fill="white" stroke="none"/><text x="195" y="343" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">Cookie: sid=A1B2</text><circle cx="48" cy="342" r="12" fill="#0E5CF4"/><text x="48" y="346" font-size="12" fill="white" font-weight="600" text-anchor="middle">3</text><path d="M322 412 L66 412" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="92" y="393" width="206" height="29" rx="8" fill="white" stroke="none"/><text x="195" y="413" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">사용자 맞춤 응답</text><circle cx="48" cy="412" r="12" fill="#0E5CF4"/><text x="48" y="416" font-size="12" fill="white" font-weight="600" text-anchor="middle">4</text><rect x="24" y="454" width="342" height="119" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="483" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">서버 세션 저장소</text><rect x="44" y="501" width="302" height="40" rx="12" fill="#EAF1FF" stroke="none"/><text x="195.0" y="526.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">sid A1B2 → user 42</text><text x="44" y="559" font-size="12" fill="#596273" font-weight="500" text-anchor="start">로그인 성공 시 생성 · 이후 ID로 조회</text><rect x="24" y="594" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="620" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">HTTPS + HttpOnly · Secure · SameSite</text></g></svg>