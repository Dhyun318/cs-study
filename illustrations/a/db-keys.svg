<svg xmlns="http://www.w3.org/2000/svg" width="390" height="596" viewBox="0 0 390 596" role="img" aria-labelledby="title desc"><title id="title">기본키와 후보키, 복합키</title><desc id="desc">employee의 emp_no와 email은 각각 후보키이며 emp_no를 PK로 고르면 email은 대체키다. name과 dept는 중복될 수 있다. order_item의 order_id와 product_id를 함께 묶으면 복합키가 된다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">행을 구분하는 키</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">유일한 후보 중 하나를 대표로 골라요</text><rect x="24" y="117" width="342" height="220" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="146" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">employee 테이블</text><rect x="44" y="165" width="138" height="50" rx="12" fill="#03257B" stroke="none"/><text x="113.0" y="195.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">emp_no</text><rect x="208" y="165" width="138" height="50" rx="12" fill="#EAF1FF" stroke="none"/><text x="277.0" y="195.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">email</text><text x="113" y="243" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">기본키 PK</text><text x="277" y="243" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">대체키</text><text x="195" y="277" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">둘 다 후보키 · 유일성 + 최소성</text><text x="44" y="313" font-size="12" fill="#596273" font-weight="500" text-anchor="start">name · dept는 중복될 수 있어요</text><text x="24" y="376" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">두 컬럼을 묶는 복합키</text><rect x="24" y="395" width="342" height="108" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="424" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">order_item</text><rect x="44" y="442" width="137" height="42" rx="12" fill="#03257B" stroke="none"/><text x="112.5" y="468.0" font-size="15" fill="white" font-weight="600" text-anchor="middle">order_id</text><rect x="209" y="442" width="137" height="42" rx="12" fill="#03257B" stroke="none"/><text x="277.5" y="468.0" font-size="15" fill="white" font-weight="600" text-anchor="middle">product_id</text><text x="195" y="469" font-size="17" fill="#0E5CF4" font-weight="600" text-anchor="middle">+</text><rect x="24" y="528" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="554" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">함께 묶어야 주문의 상품 한 행을 식별</text></g></svg>