<svg xmlns="http://www.w3.org/2000/svg" width="390" height="652" viewBox="0 0 390 652" role="img" aria-labelledby="title desc"><title id="title">TCP와 UDP 헤더 비교</title><desc id="desc">TCP는 순서, 확인, 플래그, 윈도 등 신뢰성 제어 필드를 가진다. UDP는 포트, 길이와 체크섬만 가진다. 각 블록은 필드의 비트 크기를 나타내지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / HEADER</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">헤더에 담긴 책임의 차이</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">TCP 최소 20바이트 · UDP 8바이트</text><rect x="24" y="116" width="342" height="288" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="146" font-size="20" fill="#0E5CF4" font-weight="700" text-anchor="start">TCP</text><rect x="43" y="162" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="117.0" y="184.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">출발지 포트</text><rect x="198" y="162" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="272.0" y="184.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">목적지 포트</text><rect x="43" y="206" width="148" height="35" rx="12" fill="#03257B" stroke="none"/><text x="117.0" y="228.5" font-size="12" fill="white" font-weight="600" text-anchor="middle">순서 번호</text><rect x="198" y="206" width="148" height="35" rx="12" fill="#03257B" stroke="none"/><text x="272.0" y="228.5" font-size="12" fill="white" font-weight="600" text-anchor="middle">확인 번호</text><rect x="43" y="250" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="117.0" y="272.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">헤더 길이 · 예약</text><rect x="198" y="250" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="272.0" y="272.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">제어 플래그</text><rect x="43" y="294" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="117.0" y="316.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">윈도 크기</text><rect x="198" y="294" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="272.0" y="316.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">체크섬</text><rect x="43" y="338" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="117.0" y="360.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">긴급 포인터</text><rect x="198" y="338" width="148" height="35" rx="12" fill="#EAF1FF" stroke="none"/><text x="272.0" y="360.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">옵션은 선택</text><rect x="24" y="424" width="342" height="142" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="454" font-size="20" fill="#0E5CF4" font-weight="700" text-anchor="start">UDP</text><rect x="43" y="469" width="148" height="33" rx="12" fill="#EAF1FF" stroke="none"/><text x="117.0" y="490.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">출발지 포트</text><rect x="198" y="469" width="148" height="33" rx="12" fill="#EAF1FF" stroke="none"/><text x="272.0" y="490.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">목적지 포트</text><rect x="43" y="511" width="148" height="33" rx="12" fill="#EAF1FF" stroke="none"/><text x="117.0" y="532.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">길이</text><rect x="198" y="511" width="148" height="33" rx="12" fill="#EAF1FF" stroke="none"/><text x="272.0" y="532.5" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">체크섬</text><rect x="24" y="586" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="612" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">필드의 역할 비교 · 비트 폭 비례 도식 아님</text></g></svg>