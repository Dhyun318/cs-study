<svg xmlns="http://www.w3.org/2000/svg" width="390" height="634" viewBox="0 0 390 634" role="img" aria-labelledby="title desc"><title id="title">캡슐화와 역캡슐화</title><desc id="desc">TCP/IP 4계층에서 HTTP 데이터 앞에 TCP, IP, Ethernet 헤더가 붙고 링크 트레일러 FCS도 추가된다. 수신 측은 역순으로 제거한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / ENCAPSULATION</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">헤더를 붙이고, 다시 벗기기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">계층마다 제어 정보를 더해 전송해요</text><text x="24" y="127" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">송신 · 캡슐화</text><text x="24" y="173" font-size="12" fill="#596273" font-weight="600" text-anchor="start">응용</text><rect x="91" y="151" width="160" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="171.0" y="174.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">HTTP 데이터</text><path d="M333 191 L333 210" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="24" y="239" font-size="12" fill="#596273" font-weight="600" text-anchor="start">전송</text><rect x="91" y="217" width="55" height="36" rx="12" fill="#03257B" stroke="none"/><text x="118.5" y="240.0" font-size="11" fill="white" font-weight="600" text-anchor="middle">TCP</text><rect x="149" y="217" width="160" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="229.0" y="240.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">HTTP 데이터</text><path d="M333 257 L333 276" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="24" y="305" font-size="12" fill="#596273" font-weight="600" text-anchor="start">인터넷</text><rect x="91" y="283" width="42" height="36" rx="12" fill="#0E5CF4" stroke="none"/><text x="112.0" y="306.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">IP</text><rect x="136" y="283" width="55" height="36" rx="12" fill="#03257B" stroke="none"/><text x="163.5" y="306.0" font-size="11" fill="white" font-weight="600" text-anchor="middle">TCP</text><rect x="194" y="283" width="118" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="253.0" y="306.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">데이터</text><path d="M333 323 L333 342" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="24" y="371" font-size="12" fill="#596273" font-weight="600" text-anchor="start">링크</text><rect x="91" y="349" width="42" height="36" rx="12" fill="#6194F8" stroke="none"/><text x="112.0" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">Eth</text><rect x="136" y="349" width="35" height="36" rx="12" fill="#0E5CF4" stroke="none"/><text x="153.5" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">IP</text><rect x="174" y="349" width="46" height="36" rx="12" fill="#03257B" stroke="none"/><text x="197.0" y="372.0" font-size="11" fill="white" font-weight="600" text-anchor="middle">TCP</text><rect x="223" y="349" width="80" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="263.0" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">데이터</text><rect x="306" y="349" width="42" height="36" rx="12" fill="#6194F8" stroke="none"/><text x="327.0" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">FCS</text><text x="24" y="438" font-size="13" fill="#596273" font-weight="500" text-anchor="start">비트 신호로 전송</text><path d="M160 434 L350 434" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="464" width="342" height="86" rx="20" fill="#F7F9FC" stroke="none"/><text x="44" y="489" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">수신 · 역캡슐화</text><text x="44" y="515" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">링크 → 인터넷 → 전송 → 응용</text><text x="44" y="536" font-size="12" fill="#596273" font-weight="500" text-anchor="start">각 계층이 자기 헤더를 읽고 제거</text><rect x="24" y="568" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="594" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">TCP/IP 4계층 기준 · UDP는 datagram</text></g></svg>