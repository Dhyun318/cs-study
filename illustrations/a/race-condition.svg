<svg xmlns="http://www.w3.org/2000/svg" width="390" height="520" viewBox="0 0 390 520" role="img" aria-labelledby="title desc"><title id="title">경쟁 상태와 갱신 유실</title><desc id="desc">likes가 10일 때 A와 B가 모두 10을 읽고 각각 11을 저장하면 기대 12 대신 11이 된다. 실행 순서에 따라 결과가 달라지는 경쟁 상태다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">같이 올렸는데, 하나만</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">likes++는 읽기·계산·저장으로 나뉘어요</text><rect x="24" y="116" width="342" height="44" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="143.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">공유 likes = 10</text><rect x="24" y="180" width="342" height="240" rx="14" fill="#F7F9FC" stroke="none"/><text x="36" y="204" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">순서</text><text x="90" y="204" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">Thread A</text><text x="234" y="204" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">Thread B</text><path d="M34 214 L356 214" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="238" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">1</text><text x="90" y="238" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">10 읽기</text><text x="234" y="238" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><path d="M34 248 L356 248" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="272" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">2</text><text x="90" y="272" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><text x="234" y="272" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">10 읽기</text><path d="M34 282 L356 282" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="306" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">3</text><text x="90" y="306" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><text x="234" y="306" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">11 계산</text><path d="M34 316 L356 316" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="340" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">4</text><text x="90" y="340" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><text x="234" y="340" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">11 저장</text><path d="M34 350 L356 350" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="374" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">5</text><text x="90" y="374" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">11 계산</text><text x="234" y="374" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><path d="M34 384 L356 384" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="408" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">6</text><text x="90" y="408" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">11 저장</text><text x="234" y="408" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><rect x="24" y="451" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="477" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">기대 12 → 실제 11 · 갱신 한 번이 사라짐</text></g></svg>