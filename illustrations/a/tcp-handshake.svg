<svg xmlns="http://www.w3.org/2000/svg" width="390" height="866" viewBox="0 0 390 866" role="img" aria-labelledby="title desc"><title id="title">TCP 연결과 종료</title><desc id="desc">일반적인 연결은 클라이언트 SYN, 서버 SYN과 ACK, 클라이언트 ACK다. 순차 종료 예시는 클라이언트 FIN, 서버 ACK, 서버 FIN, 클라이언트 ACK이며 능동 종료 측은 TIME_WAIT에 머문다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / NETWORK</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">연결하고, 마무리하기</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">TCP는 양쪽의 준비와 종료를 확인해요</text><rect x="24" y="114" width="342" height="282" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="143" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">01  연결</text><text x="85" y="176" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">클라이언트</text><text x="305" y="176" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">서버</text><path d="M85 190 L85 352" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><path d="M305 190 L305 352" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><path d="M85 213 L305 213" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="133" y="194" width="124" height="29" rx="9" fill="white" stroke="none"/><text x="195" y="214" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">SYN</text><circle cx="52" cy="213" r="12" fill="#0E5CF4"/><text x="52" y="217" font-size="14" fill="white" font-weight="600" text-anchor="middle">1</text><path d="M305 269 L85 269" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="133" y="250" width="124" height="29" rx="9" fill="white" stroke="none"/><text x="195" y="270" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">SYN + ACK</text><circle cx="52" cy="269" r="12" fill="#0E5CF4"/><text x="52" y="273" font-size="14" fill="white" font-weight="600" text-anchor="middle">2</text><path d="M85 325 L305 325" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="133" y="306" width="124" height="29" rx="9" fill="white" stroke="none"/><text x="195" y="326" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">ACK</text><circle cx="52" cy="325" r="12" fill="#0E5CF4"/><text x="52" y="329" font-size="14" fill="white" font-weight="600" text-anchor="middle">3</text><rect x="133" y="357" width="124" height="25" rx="12" fill="#EAF1FE" stroke="none"/><text x="195" y="374" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">데이터 전송 가능</text><rect x="24" y="416" width="342" height="332" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="445" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">02  종료</text><text x="85" y="478" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">클라이언트</text><text x="305" y="478" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">서버</text><path d="M85 492 L85 704" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><path d="M305 492 L305 704" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><path d="M85 515 L305 515" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="133" y="496" width="124" height="29" rx="9" fill="white" stroke="none"/><text x="195" y="516" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">FIN</text><circle cx="52" cy="515" r="12" fill="#0E5CF4"/><text x="52" y="519" font-size="14" fill="white" font-weight="600" text-anchor="middle">1</text><path d="M305 571 L85 571" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="133" y="552" width="124" height="29" rx="9" fill="white" stroke="none"/><text x="195" y="572" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">ACK</text><circle cx="52" cy="571" r="12" fill="#0E5CF4"/><text x="52" y="575" font-size="14" fill="white" font-weight="600" text-anchor="middle">2</text><path d="M305 627 L85 627" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="133" y="608" width="124" height="29" rx="9" fill="white" stroke="none"/><text x="195" y="628" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">FIN</text><circle cx="52" cy="627" r="12" fill="#0E5CF4"/><text x="52" y="631" font-size="14" fill="white" font-weight="600" text-anchor="middle">3</text><path d="M85 683 L305 683" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="133" y="664" width="124" height="29" rx="9" fill="white" stroke="none"/><text x="195" y="684" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">ACK</text><circle cx="52" cy="683" r="12" fill="#0E5CF4"/><text x="52" y="687" font-size="14" fill="white" font-weight="600" text-anchor="middle">4</text><text x="195" y="730" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">각 방향의 전송을 따로 닫아요</text><rect x="24" y="769" width="342" height="45" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="797" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">마지막 ACK 뒤, 능동 종료 측은 TIME_WAIT</text><text x="24" y="841" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">일반적인 연결과 순차 종료 흐름</text></g></svg>