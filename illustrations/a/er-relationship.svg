<svg xmlns="http://www.w3.org/2000/svg" width="390" height="662" viewBox="0 0 390 662" role="img" aria-labelledby="title desc"><title id="title">1대다와 다대다 관계</title><desc id="desc">author와 book은 author_id를 이용한 1대다 관계다. member와 club의 다대다 관계는 membership 연결 테이블로 분해하고 member_id와 club_id 두 외래키를 복합 기본키로 사용한다. joined_at은 관계의 속성이다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">관계를 테이블로 잇기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">N:M은 연결 테이블 하나로 풀어요</text><text x="24" y="131" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">1:N · 작가 한 명, 여러 책</text><rect x="24" y="150" width="142" height="60" rx="12" fill="#03257B" stroke="none"/><text x="95.0" y="185.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">author</text><rect x="224" y="150" width="142" height="60" rx="12" fill="#EAF1FF" stroke="none"/><text x="295.0" y="185.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">book</text><path d="M172 180 L217 180" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="195" y="165" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">1:N</text><text x="44" y="237" font-size="12" fill="#596273" font-weight="500" text-anchor="start">author_id PK</text><text x="244" y="237" font-size="12" fill="#596273" font-weight="500" text-anchor="start">author_id FK</text><text x="24" y="292" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">N:M · 회원과 동호회</text><rect x="24" y="312" width="142" height="52" rx="12" fill="#03257B" stroke="none"/><text x="95.0" y="343.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">member</text><rect x="224" y="312" width="142" height="52" rx="12" fill="#03257B" stroke="none"/><text x="295.0" y="343.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">club</text><text x="95" y="389" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">member_id PK</text><text x="295" y="389" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">club_id PK</text><path d="M95 404 L125 441" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M295 404 L265 441" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="79" y="425" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">1:N</text><text x="311" y="425" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">1:N</text><rect x="44" y="453" width="302" height="117" rx="20" fill="#F7F9FC" stroke="none"/><text x="195" y="482" font-size="18" fill="#0E5CF4" font-weight="600" text-anchor="middle">membership</text><text x="195" y="514" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">member_id FK · club_id FK</text><text x="195" y="544" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">둘을 묶어 PK · 가입일 joined_at</text><rect x="24" y="593" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="619" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">관계 자체의 정보도 연결 테이블에 저장</text></g></svg>