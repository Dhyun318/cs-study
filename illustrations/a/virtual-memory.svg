<svg xmlns="http://www.w3.org/2000/svg" width="390" height="536" viewBox="0 0 390 536" role="img" aria-labelledby="title desc"><title id="title">가상 메모리와 페이지 폴트</title><desc id="desc">CPU가 RAM에 없는 page를 참조하면 MMU가 page fault trap을 발생시킨다. 운영체제는 디스크의 page를 빈 frame에 읽고 매핑을 갱신한 뒤 명령을 다시 실행한다. 빈 frame이 없으면 교체가 필요하다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">필요한 페이지만 가져오기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">RAM에 없으면 page fault로 운영체제가 처리해요</text><rect x="24" y="120" width="342" height="66" rx="18" fill="#F7F9FC" stroke="none"/><circle cx="46" cy="146" r="12" fill="#0E5CF4"/><text x="46" y="150" font-size="12" fill="white" font-weight="600" text-anchor="middle">1</text><text x="68" y="147" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">CPU 참조</text><text x="68" y="169" font-size="12" fill="#596273" font-weight="500" text-anchor="start">필요한 page에 접근</text><path d="M195 188 L195 200" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="202" width="342" height="66" rx="18" fill="#F7F9FC" stroke="none"/><circle cx="46" cy="228" r="12" fill="#0E5CF4"/><text x="46" y="232" font-size="12" fill="white" font-weight="600" text-anchor="middle">2</text><text x="68" y="229" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">page table 확인</text><text x="68" y="251" font-size="12" fill="#596273" font-weight="500" text-anchor="start">무효 → page fault trap</text><path d="M195 270 L195 282" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="284" width="342" height="66" rx="18" fill="#F7F9FC" stroke="none"/><circle cx="46" cy="310" r="12" fill="#0E5CF4"/><text x="46" y="314" font-size="12" fill="white" font-weight="600" text-anchor="middle">3</text><text x="68" y="311" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">디스크 → RAM</text><text x="68" y="333" font-size="12" fill="#596273" font-weight="500" text-anchor="start">빈 frame에 page 읽기</text><path d="M195 352 L195 364" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="366" width="342" height="66" rx="18" fill="#F7F9FC" stroke="none"/><circle cx="46" cy="392" r="12" fill="#0E5CF4"/><text x="46" y="396" font-size="12" fill="white" font-weight="600" text-anchor="middle">4</text><text x="68" y="393" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">매핑 갱신</text><text x="68" y="415" font-size="12" fill="#596273" font-weight="500" text-anchor="start">유효로 변경 → 명령 재실행</text><rect x="24" y="468" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="494" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">빈 frame이 없으면 page 교체가 필요</text></g></svg>