<svg xmlns="http://www.w3.org/2000/svg" width="390" height="700" viewBox="0 0 390 700" role="img" aria-labelledby="title desc"><title id="title">힙의 삽입과 배열 대응</title><desc id="desc">Min Heap [5,12,9,20,15]에 3을 넣으면 부모 9, 5와 교환해 [3,12,5,20,15,9]가 된다. 완전 이진 트리와 배열이 같은 값을 나타낸다. 부모 인덱스 i의 자식은 1부터 시작할 때 2i와 2i+1이다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">작은 값이 위로 올라와요</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">Min Heap에 3을 넣고 부모와 교환해요</text><text x="24" y="126" font-size="12" fill="#596273" font-weight="600" text-anchor="start">삽입 전</text><rect x="45" y="141" width="55" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="72.5" y="167.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">5</text><rect x="106" y="141" width="55" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="133.5" y="167.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">12</text><rect x="167" y="141" width="55" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="194.5" y="167.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">9</text><rect x="228" y="141" width="55" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="255.5" y="167.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">20</text><rect x="289" y="141" width="55" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="316.5" y="167.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">15</text><path d="M195 196 L195 231" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="217" y="218" font-size="13" fill="#0E5CF4" font-weight="600" text-anchor="start">3 추가</text><rect x="24" y="247" width="342" height="239" rx="24" fill="#F7F9FC" stroke="none"/><path d="M195 298 L112 336" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><path d="M195 298 L279 336" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><path d="M112 372 L66 412" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><path d="M112 372 L158 412" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><path d="M279 372 L251 412" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><circle cx="195" cy="280" r="21" fill="#03257B"/><text x="195" y="285" font-size="15" fill="white" font-weight="600" text-anchor="middle">3</text><circle cx="112" cy="354" r="21" fill="#EAF1FF"/><text x="112" y="359" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">12</text><circle cx="279" cy="354" r="21" fill="#EAF1FF"/><text x="279" y="359" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">5</text><circle cx="66" cy="430" r="21" fill="#EAF1FF"/><text x="66" y="435" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">20</text><circle cx="158" cy="430" r="21" fill="#EAF1FF"/><text x="158" y="435" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">15</text><circle cx="251" cy="430" r="21" fill="#EAF1FF"/><text x="251" y="435" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">9</text><text x="24" y="518" font-size="12" fill="#596273" font-weight="600" text-anchor="start">삽입 후 배열 · 위에서 아래, 왼쪽부터</text><rect x="39" y="533" width="47" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="62.5" y="559.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">3</text><rect x="92" y="533" width="47" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="115.5" y="559.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">12</text><rect x="145" y="533" width="47" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="168.5" y="559.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">5</text><rect x="198" y="533" width="47" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="221.5" y="559.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">20</text><rect x="251" y="533" width="47" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="274.5" y="559.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">15</text><rect x="304" y="533" width="47" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="327.5" y="559.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">9</text><rect x="24" y="600" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="626" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">3 ↔ 9, 3 ↔ 5 · push는 O(log n)</text><text x="24" y="673" font-size="12" fill="#596273" font-weight="500" text-anchor="start">pop은 끝 원소를 root로 옮긴 뒤 아래로 정리</text></g></svg>