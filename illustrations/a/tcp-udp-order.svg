<svg xmlns="http://www.w3.org/2000/svg" width="390" height="558" viewBox="0 0 390 558" role="img" aria-labelledby="title desc"><title id="title">TCP와 UDP 전달 순서</title><desc id="desc">A, C, B 순서로 도착했을 때 TCP는 B를 기다려 A, B, C로 순서대로 앱에 전달한다. UDP는 전송 계층에서 순서 복원을 보장하지 않는다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / DELIVERY</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">도착 순서와 전달 순서</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">TCP는 순서를 맞추고, UDP는 보장하지 않아요</text><rect x="24" y="117" width="342" height="164" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="146" font-size="19" fill="#0E5CF4" font-weight="700" text-anchor="start">TCP</text><text x="44" y="170" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">먼저 온 C는 B를 기다림</text><rect x="44" y="186" width="78" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="83.0" y="207.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="138" y="186" width="78" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="177.0" y="207.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">C</text><rect x="232" y="186" width="78" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="271.0" y="207.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">B</text><text x="44" y="237" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">앱 전달</text><text x="145" y="243" font-size="19" fill="#03257B" font-weight="600" text-anchor="start">A → B → C</text><rect x="24" y="305" width="342" height="164" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="334" font-size="19" fill="#0E5CF4" font-weight="700" text-anchor="start">UDP</text><text x="44" y="358" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">도착한 순서 그대로 앱이 받을 수 있음</text><rect x="44" y="374" width="78" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="83.0" y="395.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="138" y="374" width="78" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="177.0" y="395.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">C</text><rect x="232" y="374" width="78" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="271.0" y="395.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">B</text><text x="44" y="425" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">앱 전달</text><text x="145" y="431" font-size="19" fill="#03257B" font-weight="600" text-anchor="start">A → C → B</text><rect x="24" y="491" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="517" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">A·B·C는 순서가 있는 데이터 조각</text></g></svg>