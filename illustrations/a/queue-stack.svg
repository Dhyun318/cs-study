<svg xmlns="http://www.w3.org/2000/svg" width="390" height="584" viewBox="0 0 390 584" role="img" aria-labelledby="title desc"><title id="title">큐와 스택의 출입 순서</title><desc id="desc">A, B, C 순서로 넣었을 때 큐는 front의 A부터 꺼내고 rear에 넣는다. 스택은 top의 C부터 꺼내며 top에서 넣고 뺀다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">먼저 꺼낼까, 나중에 꺼낼까</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">같은 A, B, C도 꺼내는 순서가 달라요</text><rect x="24" y="116" width="342" height="162" rx="8" fill="#FFFFFF" stroke="none"/><text x="43" y="145" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">QUEUE</text><text x="347" y="145" font-size="14" fill="#4E5968" font-weight="600" text-anchor="end">FIFO</text><text x="44" y="177" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">front</text><text x="345" y="177" font-size="14" fill="#4E5968" font-weight="600" text-anchor="end">rear</text><rect x="90" y="190" width="64" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="122.0" y="216.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="162" y="190" width="64" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="194.0" y="216.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">B</text><rect x="234" y="190" width="64" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="266.0" y="216.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">C</text><path d="M81 211 L44 211" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M344 211 L301 211" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="43" y="257" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">dequeue A</text><text x="346" y="257" font-size="14" fill="#03257B" font-weight="600" text-anchor="end">enqueue →</text><rect x="24" y="302" width="342" height="191" rx="8" fill="#FFFFFF" stroke="none"/><text x="43" y="332" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">STACK</text><text x="347" y="332" font-size="14" fill="#4E5968" font-weight="600" text-anchor="end">LIFO</text><rect x="132" y="354" width="126" height="34" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="376.0" font-size="16" fill="white" font-weight="600" text-anchor="middle">C · top</text><rect x="132" y="396" width="126" height="34" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="418.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">B</text><rect x="132" y="438" width="126" height="34" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="460.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">A</text><path d="M107 374 L107 342" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="43" y="376" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">pop C</text><path d="M281 342 L281 374" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="290" y="366" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">push</text><rect x="24" y="516" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="542" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">Queue는 A부터, Stack은 C부터</text></g></svg>