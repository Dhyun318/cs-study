<svg xmlns="http://www.w3.org/2000/svg" width="390" height="646" viewBox="0 0 390 646" role="img" aria-labelledby="title desc"><title id="title">인덱스에서 실제 행으로</title><desc id="desc">notes의 member 이름 이도현을 정렬된 이름 인덱스에서 찾은 뒤 해당 행의 위치로 이동한다. 실제 위치 표현은 DBMS에 따라 다르며 InnoDB 보조 인덱스는 PK로 클러스터형 인덱스를 다시 탐색한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">이름에서 행으로 바로</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">정렬된 인덱스가 데이터 위치를 알려줘요</text><rect x="24" y="117" width="342" height="47" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="145.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">WHERE name = &#x27;이도현&#x27;</text><text x="24" y="201" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">이름 인덱스</text><rect x="24" y="220" width="342" height="134" rx="20" fill="#F7F9FC" stroke="none"/><text x="44" y="247" font-size="12" fill="#596273" font-weight="500" text-anchor="start">정렬된 검색 키</text><text x="44" y="286" font-size="20" fill="#0E5CF4" font-weight="600" text-anchor="start">이도현</text><text x="44" y="322" font-size="13" fill="#596273" font-weight="500" text-anchor="start">찾은 항목의 행 위치를 따라가기</text><path d="M195 365 L195 399" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="24" y="428" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">member 테이블의 해당 행</text><rect x="24" y="448" width="342" height="70" rx="14" fill="#F7F9FC" stroke="none"/><text x="36" y="472" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">name</text><text x="171" y="472" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">그 밖의 컬럼</text><path d="M34 482 L356 482" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="506" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">이도현</text><text x="171" y="506" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">해당 회원의 데이터</text><rect x="24" y="550" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="576" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">인덱스 탐색 → 행 위치 → 필요한 데이터</text><text x="24" y="619" font-size="12" fill="#596273" font-weight="500" text-anchor="start">InnoDB 보조 인덱스는 PK로 한 번 더 탐색</text></g></svg>