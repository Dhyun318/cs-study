<svg xmlns="http://www.w3.org/2000/svg" width="390" height="588" viewBox="0 0 390 588" role="img" aria-labelledby="title desc"><title id="title">문맥 전환의 저장과 복구</title><desc id="desc">A에서 B로 전환할 때 커널은 A의 프로그램 카운터와 레지스터를 PCB A에 저장하고 PCB B의 문맥을 CPU에 복구한다. 이후 B가 실행된다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">02 / OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">잠깐 저장, 이어서 실행</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">CPU가 작업을 바꿀 때 문맥을 보관해요</text><rect x="24" y="117" width="342" height="64" rx="8" fill="#FFFFFF" stroke="none"/><rect x="36" y="129" width="92" height="40" rx="12" fill="#03257B" stroke="none"/><text x="82" y="155" font-size="16" fill="white" font-weight="600" text-anchor="middle">A 실행</text><path d="M141 149 L241 149" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="191" y="139" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">전환</text><rect x="254" y="129" width="100" height="40" rx="12" fill="#EAF1FE" stroke="none"/><text x="304" y="155" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">B 실행</text><rect x="24" y="208" width="342" height="260" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="235" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">KERNEL</text><rect x="139" y="255" width="112" height="66" rx="18" fill="#03257B" stroke="none"/><text x="195" y="283" font-size="20" fill="white" font-weight="700" text-anchor="middle">CPU</text><text x="195" y="305" font-size="14" fill="white" font-weight="600" text-anchor="middle">PC · 레지스터</text><path d="M165 329 L105 378" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="120" cy="345" r="12" fill="#0E5CF4"/><text x="120" y="349" font-size="14" fill="white" font-weight="600" text-anchor="middle">1</text><text x="78" y="356" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">저장</text><path d="M284 378 L232 330" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="269" cy="345" r="12" fill="#0E5CF4"/><text x="269" y="349" font-size="14" fill="white" font-weight="600" text-anchor="middle">2</text><text x="288" y="356" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">복구</text><rect x="43" y="389" width="138" height="60" rx="14" fill="white" stroke="#E5E8EB"/><text x="59" y="414" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">PCB A</text><text x="59" y="435" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">멈춘 위치 · 레지스터</text><rect x="209" y="389" width="138" height="60" rx="14" fill="#EAF1FE" stroke="#6194F8"/><text x="225" y="414" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="start">PCB B</text><text x="225" y="435" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">이어갈 위치 · 레지스터</text><rect x="24" y="490" width="342" height="46" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="518" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">A 문맥 저장 → B 문맥 복구 → B 실행</text><text x="24" y="563" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">A를 다시 실행할 때는 PCB A에서 복구</text></g></svg>