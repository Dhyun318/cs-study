<svg xmlns="http://www.w3.org/2000/svg" width="390" height="634" viewBox="0 0 390 634" role="img" aria-labelledby="title desc"><title id="title">HTTP 요청과 응답 메시지</title><desc id="desc">notes의 GET /books?id=7 요청과 HTTP/1.1 200 OK 응답을 사용한다. GET의 조회 조건은 URL 쿼리로, POST 데이터는 요청 바디로 보낼 수 있으며 둘 다 HTTPS가 필요하다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / HTTP</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">요청과 응답을 읽는 순서</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">시작 줄 → 헤더 → 빈 줄 → 바디</text><rect x="24" y="117" width="342" height="155" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="145" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="start">요청</text><text x="44" y="174" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">GET /books?id=7 HTTP/1.1</text><text x="44" y="203" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">Host: shop.example.com</text><text x="44" y="228" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">Accept: application/json</text><text x="44" y="251" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">빈 줄 뒤, 필요한 경우 바디</text><rect x="24" y="292" width="342" height="154" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="320" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="start">응답</text><text x="44" y="348" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">HTTP/1.1 200 OK</text><text x="44" y="376" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">Content-Type: application/json</text><text x="44" y="419" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="start">{&quot;id&quot;: 7, &quot;title&quot;: &quot;...&quot;}</text><text x="24" y="480" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">데이터를 싣는 위치</text><rect x="24" y="496" width="160" height="50" rx="12" fill="#EAF1FE" stroke="none"/><text x="104.0" y="526.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">GET · URL 쿼리</text><rect x="206" y="496" width="160" height="50" rx="12" fill="#EAF1FE" stroke="none"/><text x="286.0" y="526.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">POST · 요청 바디</text><rect x="24" y="567" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="593" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">POST도 HTTPS가 없으면 평문 전송</text></g></svg>