<svg xmlns="http://www.w3.org/2000/svg" width="390" height="534" viewBox="0 0 390 534" role="img" aria-labelledby="title desc"><title id="title">페이징 주소 변환</title><desc id="desc">notes 예시: page 크기 1024바이트일 때 논리 주소 2500은 page 2와 offset 452다. page table의 page 2가 frame 9에 대응하므로 물리 주소는 9668이고 offset은 유지된다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">페이지에서 프레임으로</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">page 크기 1KB · offset은 그대로 유지해요</text><rect x="24" y="117" width="342" height="49" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="146.5" font-size="18" fill="white" font-weight="600" text-anchor="middle">논리 주소 2500</text><text x="195" y="193" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">2500 = 2 × 1024 + 452</text><rect x="24" y="215" width="155" height="47" rx="12" fill="#EAF1FE" stroke="none"/><text x="101.5" y="243.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">page 2</text><rect x="211" y="215" width="155" height="47" rx="12" fill="#F2F4F6" stroke="none"/><text x="288.5" y="243.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">offset 452</text><path d="M101 267 L101 285" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="292" width="155" height="70" rx="14" fill="#FFFFFF" stroke="none"/><text x="36" y="316" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">page</text><text x="110" y="316" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">frame</text><path d="M34 326 L169 326" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="350" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">2</text><text x="110" y="350" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">9</text><path d="M101 368 L101 389" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="395" width="155" height="45" rx="12" fill="#EAF1FE" stroke="none"/><text x="101.5" y="422.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">frame 9</text><rect x="211" y="395" width="155" height="45" rx="12" fill="#F2F4F6" stroke="none"/><text x="288.5" y="422.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">offset 452</text><path d="M289 268 L289 387" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><rect x="24" y="466" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="492" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">물리 주소 9 × 1024 + 452 = 9668</text></g></svg>