<svg xmlns="http://www.w3.org/2000/svg" width="390" height="518" viewBox="0 0 390 518" role="img" aria-labelledby="title desc"><title id="title">세그먼테이션의 범위 검사</title><desc id="desc">notes 예시: segment 1의 base는 8000, limit은 600이다. offset 200은 유효해 8200으로 변환하지만 offset 700은 limit을 벗어나 접근 위반 trap이 발생한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">범위 확인 후 주소 더하기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">segment마다 base와 limit이 달라요</text><rect x="24" y="117" width="342" height="70" rx="14" fill="#F7F9FC" stroke="none"/><text x="36" y="141" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">segment</text><text x="150" y="141" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">base</text><text x="264" y="141" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">limit</text><path d="M34 151 L356 151" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="175" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">1</text><text x="150" y="175" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">8000</text><text x="264" y="175" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">600</text><rect x="24" y="221" width="342" height="46" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="249.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">논리 주소 (1, 200)</text><path d="M195 273 L195 293" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="300" width="342" height="87" rx="20" fill="#F7F9FC" stroke="none"/><text x="195" y="330" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">200 &lt; 600 · 범위 안</text><text x="195" y="360" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">8000 + 200 = 8200</text><rect x="24" y="410" width="342" height="77" rx="16" fill="#FFE0B0" stroke="none"/><text x="195" y="440" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">(1, 700)은 limit 밖</text><text x="195" y="465" font-size="12" fill="#03257B" font-weight="500" text-anchor="middle">주소를 만들지 않고 접근 위반 trap</text></g></svg>