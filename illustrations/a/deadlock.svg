<svg xmlns="http://www.w3.org/2000/svg" width="390" height="510" viewBox="0 0 390 510" role="img" aria-labelledby="title desc"><title id="title">교착 상태의 순환 대기</title><desc id="desc">Thread 1은 A를 보유한 채 B를 요청하고 Thread 2는 B를 보유한 채 A를 요청해 둘 다 멈춘다. 모든 주체의 lock 순서를 A 다음 B로 통일하면 이 순환 대기를 막을 수 있다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">서로 기다리며 멈춘 상태</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">자원을 잡는 순서가 다르면 교착될 수 있어요</text><rect x="24" y="117" width="342" height="263" rx="24" fill="#F7F9FC" stroke="none"/><rect x="44" y="145" width="126" height="48" rx="12" fill="#03257B" stroke="none"/><text x="107.0" y="174.0" font-size="14" fill="white" font-weight="600" text-anchor="middle">Thread 1</text><rect x="220" y="145" width="126" height="48" rx="12" fill="#03257B" stroke="none"/><text x="283.0" y="174.0" font-size="14" fill="white" font-weight="600" text-anchor="middle">Thread 2</text><rect x="44" y="300" width="126" height="48" rx="12" fill="#EAF1FF" stroke="none"/><text x="107.0" y="329.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">자원 A · 점유</text><rect x="220" y="300" width="126" height="48" rx="12" fill="#EAF1FF" stroke="none"/><text x="283.0" y="329.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">자원 B · 점유</text><path d="M107 201 L107 290" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="118" y="247" font-size="12" fill="#596273" font-weight="500" text-anchor="start">보유</text><path d="M283 201 L283 290" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="294" y="247" font-size="12" fill="#596273" font-weight="500" text-anchor="start">보유</text><path d="M174 178 L252 291" fill="none" stroke="#FFE0B0" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M216 178 L138 291" fill="none" stroke="#FFE0B0" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="195" y="262" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">상대 자원 요청 → 대기</text><rect x="24" y="408" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="434" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">예방: 모두 A → B 순서로 lock 획득</text><text x="24" y="481" font-size="12" fill="#596273" font-weight="500" text-anchor="start">상호 배제 · 점유 대기 · 비선점 · 순환 대기</text></g></svg>