<svg xmlns="http://www.w3.org/2000/svg" width="390" height="536" viewBox="0 0 390 536" role="img" aria-labelledby="title desc"><title id="title">연결 리스트의 삽입과 삭제</title><desc id="desc">A와 B 사이에 X를 넣는다. X.next를 B로 지정한 뒤 A.next를 X로 바꾼다. 삭제 시 앞 노드의 next를 다음 노드로 연결해 건너뛴다. 위치를 찾는 비용은 별도다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">노드 사이에 끼워 넣기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">원소를 밀지 않고 next 연결을 바꿔요</text><rect x="24" y="116" width="342" height="235" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="144" font-size="13" fill="#596273" font-weight="600" text-anchor="start">A 다음에 새 노드 X 삽입</text><rect x="43" y="179" width="72" height="52" rx="12" fill="#03257B" stroke="none"/><text x="79.0" y="210.0" font-size="18" fill="white" font-weight="600" text-anchor="middle">A</text><rect x="275" y="179" width="72" height="52" rx="12" fill="#EAF1FF" stroke="none"/><text x="311.0" y="210.0" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">B</text><path d="M121 205 L268 205" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><text x="195" y="190" font-size="11" fill="#596273" font-weight="500" text-anchor="middle">기존 next</text><rect x="159" y="273" width="72" height="52" rx="12" fill="#EAF1FF" stroke="none"/><text x="195.0" y="304.0" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">X</text><path d="M100 238 L159 272" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M232 272 L289 238" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="116" cy="263" r="12" fill="#0E5CF4"/><text x="116" y="267" font-size="12" fill="white" font-weight="600" text-anchor="middle">2</text><circle cx="272" cy="263" r="12" fill="#0E5CF4"/><text x="272" y="267" font-size="12" fill="white" font-weight="600" text-anchor="middle">1</text><text x="24" y="384" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">1  X.next = B</text><text x="24" y="414" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">2  A.next = X</text><rect x="24" y="441" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="467" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">삭제는 앞 노드의 next로 건너뛰기</text><text x="24" y="510" font-size="13" fill="#596273" font-weight="500" text-anchor="start">위치를 이미 알 때 연결 변경은 O(1)</text></g></svg>