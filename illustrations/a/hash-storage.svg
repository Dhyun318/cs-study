<svg xmlns="http://www.w3.org/2000/svg" width="390" height="652" viewBox="0 0 390 652" role="img" aria-labelledby="title desc"><title id="title">해시 테이블 저장 위치</title><desc id="desc">notes의 h(k)=k mod 7 예시를 사용한다. 1032는 버킷 3, 2055는 4, 3100은 6에 저장된다. 문자열 키는 먼저 정수 해시값으로 변환한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">키를 작은 인덱스로</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">해시 함수가 저장할 버킷을 정해요</text><rect x="24" y="116" width="342" height="109" rx="24" fill="#F7F9FC" stroke="none"/><rect x="43" y="144" width="102" height="52" rx="12" fill="#EAF1FF" stroke="none"/><text x="94.0" y="175.0" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">1032</text><path d="M153 170 L176 170" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="187" y="144" width="125" height="52" rx="12" fill="#03257B" stroke="none"/><text x="249.5" y="175.0" font-size="14" fill="white" font-weight="600" text-anchor="middle">h(k)=k % 7</text><text x="334" y="176" font-size="22" fill="#0E5CF4" font-weight="700" text-anchor="middle">3</text><text x="24" y="260" font-size="14" fill="#596273" font-weight="600" text-anchor="start">키 범위가 커도 버킷은 7개</text><rect x="24" y="279" width="342" height="274" rx="14" fill="#F7F9FC" stroke="none"/><text x="36" y="303" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">버킷</text><text x="136" y="303" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">저장된 키</text><path d="M34 313 L356 313" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="337" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">0</text><text x="136" y="337" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><path d="M34 347 L356 347" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="371" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">1</text><text x="136" y="371" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><path d="M34 381 L356 381" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="405" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">2</text><text x="136" y="405" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><path d="M34 415 L356 415" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="439" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">3</text><text x="136" y="439" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">1032</text><path d="M34 449 L356 449" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="473" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">4</text><text x="136" y="473" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">2055</text><path d="M34 483 L356 483" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="507" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">5</text><text x="136" y="507" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><path d="M34 517 L356 517" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="541" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">6</text><text x="136" y="541" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">3100</text><rect x="24" y="584" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="610" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">같은 키는 같은 버킷으로</text></g></svg>