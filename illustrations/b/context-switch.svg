<svg xmlns="http://www.w3.org/2000/svg" width="390" height="500" viewBox="0 0 390 500" role="img" aria-labelledby="title desc"><title id="title">작업을 바꾸는 작은 보관함</title><desc id="desc">A 실행 문맥의 PC와 레지스터를 PCB A에 저장하고 PCB B에서 문맥을 복구한 뒤 B를 실행한다. 사물은 개념을 설명하는 비유다.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE8FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6194F8"/><stop offset="1" stop-color="#0E5CF4"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1744A3"/><stop offset="1" stop-color="#03257B"/></linearGradient><radialGradient id="halo"><stop stop-color="#E7EFFF"/><stop offset="1" stop-color="#F7F9FC" stop-opacity="0"/></radialGradient><filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#03257B" flood-opacity=".12"/></filter></defs><g font-family="Pretendard, -apple-system, sans-serif"><circle cx="195" cy="235" r="190" fill="url(#halo)"/><text x="24" y="35" text-anchor="start" font-size="21" font-weight="700" fill="#03257B">작업을 바꾸는 작은 보관함</text><text x="24" y="60" text-anchor="start" font-size="13" font-weight="500" fill="#596273">하던 일은 보관하고, 다음 일을 꺼내요</text><ellipse cx="195" cy="358" rx="153" ry="33" fill="#E7ECF5"/><path d="M56 287 L195 216 L335 287 L195 365 Z" fill="#F0F4FC" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M56 287 V303 L195 381 V365 Z" fill="#DFE8F7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M195 365 L335 287 V303 L195 381 Z" fill="#D0DDF1" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(55 277)" filter="url(#shadow)"><path d="M0 0 L76 -25 L98 -9 L22 16 Z" fill="#D6E3FF" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0 L22 16 V93 L0 77 Z" fill="#A8C3FA" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M22 16 L98 -9 V68 L22 93 Z" fill="url(#paper)" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 66 L86 49" fill="none" stroke="#6194F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 78 L86 61" fill="none" stroke="#6194F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="59" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="#03257B">PCB A</text><text x="59" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="#0E5CF4">보관</text></g><g transform="translate(238 277)" filter="url(#shadow)"><path d="M0 0 L76 -25 L98 -9 L22 16 Z" fill="#D6E3FF" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M0 0 L22 16 V93 L0 77 Z" fill="#A8C3FA" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M22 16 L98 -9 V68 L22 93 Z" fill="url(#blue)" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 66 L86 49" fill="none" stroke="#6194F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M35 78 L86 61" fill="none" stroke="#6194F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><text x="59" y="34" text-anchor="middle" font-size="14" font-weight="600" fill="white">PCB B</text><text x="59" y="53" text-anchor="middle" font-size="10" font-weight="600" fill="white">복구</text></g><path d="M153 196 C69 184 48 224 85 267" fill="none" stroke="#6194F8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M79 253 L85 267 L94 254" fill="none" stroke="#6194F8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M296 263 C338 207 283 166 248 181" fill="none" stroke="#0E5CF4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M259 170 L248 181 L263 185" fill="none" stroke="#0E5CF4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><g transform="translate(166 153) scale(1.2)"><path d="M0 -10 v-12 M0 58 v12 M-22 -10 h-12 M62 -10 h12" fill="none" stroke="#6194F8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M14 -10 v-12 M14 58 v12 M-22 4 h-12 M62 4 h12" fill="none" stroke="#6194F8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M28 -10 v-12 M28 58 v12 M-22 18 h-12 M62 18 h12" fill="none" stroke="#6194F8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 -10 v-12 M42 58 v12 M-22 32 h-12 M62 32 h12" fill="none" stroke="#6194F8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M-25 -4 L25 -30 L76 -4 L25 24 Z" fill="#BED3FF" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-25 -4 L25 24 V69 L-25 40 Z" fill="#6194F8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M25 24 L76 -4 V40 L25 69 Z" fill="#0E5CF4" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M-15 -3 L25 -23 L65 -3 L25 18 Z" fill="url(#navy)" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="25" y="1" text-anchor="middle" font-size="13" font-weight="600" fill="white">CPU</text></g><circle cx="75" cy="211" r="11" fill="#03257B"/><text x="75" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="white">1</text><text x="80" y="235" text-anchor="middle" font-size="13" font-weight="600" fill="#03257B">저장</text><circle cx="308" cy="205" r="11" fill="#03257B"/><text x="308" y="209" text-anchor="middle" font-size="11" font-weight="600" fill="white">2</text><text x="312" y="231" text-anchor="middle" font-size="13" font-weight="600" fill="#03257B">복구</text><path d="M62 127 h10 M67 122 v10" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M308 119 h10 M313 114 v10" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="88" y="400" width="214" height="39" rx="19" fill="#EAF1FF" /><text x="195" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#0E5CF4">A 실행 → 문맥 전환 → B 실행</text><text x="195" y="468" text-anchor="middle" font-size="13" font-weight="500" fill="#596273">PC와 레지스터를 PCB에 저장·복구</text></g></svg>