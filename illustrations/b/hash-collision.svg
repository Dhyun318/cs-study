<svg xmlns="http://www.w3.org/2000/svg" width="390" height="500" viewBox="0 0 390 500" role="img" aria-labelledby="title desc"><title id="title">한 칸에서 만난 두 키</title><desc id="desc">키 14와 26을 6으로 나눈 나머지는 2다. 같은 버킷에 충돌한 두 항목을 연결 리스트로 보관한다.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE8FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6194F8"/><stop offset="1" stop-color="#0E5CF4"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1744A3"/><stop offset="1" stop-color="#03257B"/></linearGradient><radialGradient id="halo"><stop stop-color="#E7EFFF"/><stop offset="1" stop-color="#F7F9FC" stop-opacity="0"/></radialGradient><filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#03257B" flood-opacity=".12"/></filter></defs><g font-family="Pretendard, -apple-system, sans-serif"><circle cx="195" cy="235" r="190" fill="url(#halo)"/><text x="24" y="35" text-anchor="start" font-size="21" font-weight="700" fill="#03257B">한 칸에서 만난 두 키</text><text x="24" y="60" text-anchor="start" font-size="13" font-weight="500" fill="#596273">서로 다른 키가 한 버킷으로</text><ellipse cx="195" cy="346" rx="145" ry="27" fill="#E7ECF5"/><path d="M100 123 Q87 195 151 227 M292 125 Q307 193 241 228" fill="none" stroke="#BED3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><g transform="translate(107 134) rotate(-17)" filter="url(#shadow)"><rect x="-32" y="-42" width="64" height="84" rx="16" fill="url(#blue)" /><circle cx="0" cy="-25" r="5" fill="#D6E3FF"/><text x="0" y="16" text-anchor="middle" font-size="28" font-weight="700" fill="white">14</text></g><g transform="translate(282 125) rotate(16)" filter="url(#shadow)"><rect x="-32" y="-42" width="64" height="84" rx="16" fill="url(#blue)" /><circle cx="0" cy="-25" r="5" fill="#D6E3FF"/><text x="0" y="16" text-anchor="middle" font-size="28" font-weight="700" fill="white">26</text></g><path d="M200 103 h10 M205 98 v10" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M51 218 h10 M56 213 v10" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="333" cy="217" r="4" fill="#FFE0B0"/><g filter="url(#shadow)"><path d="M121 235 L139 321 Q195 359 251 321 L269 235 Z" fill="url(#blue)" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="195" cy="235" rx="74" ry="27" fill="#A8C3FA"/><ellipse cx="195" cy="235" rx="60" ry="19" fill="#03257B"/><path d="M143 257 L152 312" fill="none" stroke="#A8C3FA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><rect x="174" y="272" width="42" height="39" rx="12" fill="white" /><text x="195" y="299" text-anchor="middle" font-size="24" font-weight="700" fill="#0E5CF4">2</text></g><rect x="137" y="184" width="116" height="28" rx="14" fill="#FFE0B0" /><text x="195" y="203" text-anchor="middle" font-size="13" font-weight="600" fill="#03257B">h(k) = k % 6</text><path d="M195 351 V375" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="195" y="401" text-anchor="middle" font-size="13" font-weight="600" fill="#596273">버킷 2의 연결 리스트</text><rect x="54" y="419" width="96" height="44" rx="14" fill="url(#paper)" /><text x="102" y="447" text-anchor="middle" font-size="21" font-weight="700" fill="#0E5CF4">14</text><rect x="240" y="419" width="96" height="44" rx="14" fill="url(#paper)" /><text x="288" y="447" text-anchor="middle" font-size="21" font-weight="700" fill="#0E5CF4">26</text><g transform="translate(195 441) rotate(-14)" fill="none" stroke="#6194F8" stroke-width="4"><rect x="-29" y="-10" width="37" height="20" rx="10"/><rect x="-8" y="-10" width="37" height="20" rx="10"/></g></g></svg>