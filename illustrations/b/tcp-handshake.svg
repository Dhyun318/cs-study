<svg xmlns="http://www.w3.org/2000/svg" width="390" height="500" viewBox="0 0 390 500" role="img" aria-labelledby="title desc"><title id="title">연결을 여는 세 통의 메시지</title><desc id="desc">클라이언트에서 서버로 SYN, 서버에서 클라이언트로 SYN과 ACK, 클라이언트에서 서버로 ACK를 전송해 연결한다. 순차 종료는 FIN, ACK, FIN, ACK이며 능동 종료 측은 TIME_WAIT에 머문다.</desc><defs><linearGradient id="paper" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE8FF"/></linearGradient><linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6194F8"/><stop offset="1" stop-color="#0E5CF4"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1744A3"/><stop offset="1" stop-color="#03257B"/></linearGradient><radialGradient id="halo"><stop stop-color="#E7EFFF"/><stop offset="1" stop-color="#F7F9FC" stop-opacity="0"/></radialGradient><filter id="shadow" x="-50%" y="-50%" width="200%" height="220%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#03257B" flood-opacity=".12"/></filter></defs><g font-family="Pretendard, -apple-system, sans-serif"><circle cx="195" cy="235" r="190" fill="url(#halo)"/><text x="24" y="35" text-anchor="start" font-size="21" font-weight="700" fill="#03257B">연결을 여는 세 통의 메시지</text><text x="24" y="60" text-anchor="start" font-size="13" font-weight="500" fill="#596273">세 번의 확인으로 연결을 시작해요</text><ellipse cx="196" cy="337" rx="158" ry="25" fill="#E7ECF5"/><path d="M73 230 C52 119 304 106 318 231" fill="none" stroke="#BED3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><path d="M302 278 C258 346 129 347 87 282" fill="none" stroke="#BED3FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 7"/><g filter="url(#shadow)"><path d="M35 235 L107 218 L118 283 L44 303 Z" fill="url(#navy)" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M42 241 L101 227 L109 277 L49 293 Z" fill="url(#blue)" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M44 303 L118 283 L148 309 L69 333 L26 314 Z" fill="#D9E6FF" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M26 314 L69 333 L148 309 V315 L69 340 L26 321 Z" fill="#A8C3FA" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M59 308 L116 293 L129 304 L72 320 Z" fill="#B6CDF7" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M60 257 L73 264 L91 241" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></g><g filter="url(#shadow)"><path d="M269 216 L316 192 L352 210 L304 235 Z" fill="#A8C3FA" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M269 216 L304 235 V328 L269 307 Z" fill="#6194F8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 235 L352 210 V303 L304 328 Z" fill="url(#navy)" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M313 245 L341 231" fill="none" stroke="#6194F8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="315" cy="244" r="2" fill="#FFE0B0"/><path d="M313 269 L341 255" fill="none" stroke="#6194F8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="315" cy="268" r="2" fill="#FFE0B0"/><path d="M313 293 L341 279" fill="none" stroke="#6194F8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="315" cy="292" r="2" fill="#FFE0B0"/></g><g transform="translate(139 148) rotate(-13)" filter="url(#shadow)"><rect x="-36" y="-23" width="72" height="46" rx="10" fill="url(#paper)" /><path d="M-32 -16 L0 5 L32 -16" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-31 17 L-10 1 M31 17 L10 1" fill="none" stroke="#BED3FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-28" y="13" width="56" height="20" rx="8" fill="white" /><text x="0" y="27" text-anchor="middle" font-size="11" font-weight="600" fill="#0E5CF4">1  SYN</text></g><g transform="translate(244 205) rotate(10)" filter="url(#shadow)"><rect x="-36" y="-23" width="72" height="46" rx="10" fill="url(#paper)" /><path d="M-32 -16 L0 5 L32 -16" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-31 17 L-10 1 M31 17 L10 1" fill="none" stroke="#BED3FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-28" y="13" width="56" height="20" rx="8" fill="white" /><text x="0" y="27" text-anchor="middle" font-size="11" font-weight="600" fill="#0E5CF4">2  SYN + ACK</text></g><g transform="translate(171 285) rotate(-12)" filter="url(#shadow)"><rect x="-36" y="-23" width="72" height="46" rx="10" fill="url(#paper)" /><path d="M-32 -16 L0 5 L32 -16" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M-31 17 L-10 1 M31 17 L10 1" fill="none" stroke="#BED3FF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><rect x="-28" y="13" width="56" height="20" rx="8" fill="white" /><text x="0" y="27" text-anchor="middle" font-size="11" font-weight="600" fill="#0E5CF4">3  ACK</text></g><path d="M173 131 L197 135 L188 142" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M206 205 L186 209 L195 215" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M208 276 L231 273 L223 282" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="79" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#03257B">클라이언트</text><text x="315" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#03257B">서버</text><path d="M55 143 h10 M60 138 v10" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M327 140 h10 M332 135 v10" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="24" y="389" width="342" height="84" rx="20" fill="#F2F3F5" /><text x="43" y="414" text-anchor="start" font-size="12" font-weight="600" fill="#596273">종료는 각 방향을 따로</text><text x="63" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#0E5CF4">FIN →</text><text x="151" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#0E5CF4">← ACK</text><text x="239" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#0E5CF4">← FIN</text><text x="321" y="441" text-anchor="middle" font-size="12" font-weight="600" fill="#0E5CF4">ACK →</text><text x="195" y="460" text-anchor="middle" font-size="10" font-weight="500" fill="#596273">능동 종료 측은 마지막 ACK 뒤 TIME_WAIT</text></g></svg>