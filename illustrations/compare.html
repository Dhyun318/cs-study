.</p><nav aria-label="과목 바로가기"><a href="#subject-0">자료구조</a><a href="#subject-1">운영체제</a><a href="#subject-2">데이터베이스</a><a href="#subject-3">네트워크</a></nav></header><section id="subject-0" aria-labelledby="heading-0"><h2 id="heading-0">자료구조<small>8개</small></h2><div class="frames"><svg class="connections" aria-hidden="true"></svg><figure class="frame" data-id="dynamic-array"><figcaption class="frame-title">동적 배열<span>dynamic-array · 4.0 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="500" viewBox="0 0 390 500" role="img" aria-labelledby="dynamic-array-title dynamic-array-desc"><title id="dynamic-array-title">동적 배열의 확장</title><desc id="dynamic-array-desc">용량 4 배열에 다섯 번째 값 E를 넣기 위해 용량 8 배열을 새로 만들고 A, B, C, D를 복사한다. 확장 한 번은 O(n), append는 분할상환 O(1)이다.</desc><defs><marker id="dynamic-array-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">가득 차면 더 넓게</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">새 배열을 만들고 기존 원소를 옮겨요</text><rect x="24" y="116" width="342" height="92" rx="24" fill="#F7F9FC" stroke="none"/><text x="42" y="141" font-size="13" fill="#596273" font-weight="600" text-anchor="start">용량 4 · 원소 4개</text><rect x="42" y="153" width="64" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="74.0" y="179.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="112" y="153" width="64" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="144.0" y="179.0" font-size="15" fill="#03257B" font-weight="600" text-anc text-anchor="middle">A</text><rect x="275" y="179" width="72" height="52" rx="12" fill="#EAF1FF" stroke="none"/><text x="311.0" y="210.0" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">B</text><path d="M121 205 L268 205" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 6"/><text x="195" y="190" font-size="11" fill="#596273" font-weight="500" text-anchor="middle">기존 next</text><rect x="159" y="273" width="72" height="52" rx="12" fill="#EAF1FF" stroke="none"/><text x="195.0" y="304.0" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">X</text><path d="M100 238 L159 272" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#linked-list-arrow)"/><path d="M232 272 L289 238" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#linked-list-arrow)"/><circle cx="116" cy="263" r="12" fill="#0E5CF4"/><text x="116" y="267" font-size="12" fill="white" font-weight="600" text-anchor="middle">2</text><circle cx="272" cy="263" r="12" fill="#0E5CF4"/><text x="272" y="267" font-size="12" fill="white" font-weight="600" text-anchor="middle">1</text><text x="24" y="384" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">1  X.next = B</text><text x="24" y="414" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">2  A.next = X</text><rect x="24" y="441" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="467" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">삭제는 앞 노드의 next로 건너뛰기</text><text x="24" y="510" font-size="13" fill="#596273" font-weight="500" text-anchor="start">위치를 이미 알 때 연결 변경은 O(1)</text></g></svg></div></figure><figure class="frame" data-id="queue-stack"><figcaption class="frame-title">큐와 스택<span>queue-stack · 4.0 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="584" viewBox="0 0 390 584" role="img" aria-labelledby="queue-stack-title queue-stack-desc"><title id="queue-stack-title">큐와 스택의 출입 순서</title><desc id="queue-stack-desc">A, B, C 순서로 넣었을 때 큐는 front의 A부터 꺼내고 rear에 넣는다. 스택은 top의 C부터 꺼내며 top에서 넣고 뺀다.</desc><defs><marker id="queue-stack-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">먼저 꺼낼까, 나중에 꺼낼까</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">같은 A, B, C도 꺼내는 순서가 달라요</text><rect x="24" y="116" width="342" height="162" rx="24" fill="#F7F9FC" stroke="none"/><text x="43" y="145" font-size="13" fill="#0E5CF4" font-weight="600" text-anchor="start">QUEUE</text><text x="347" y="145" font-size="13" fill="#596273" font-weight="600" text-anchor="end">FIFO</text><text x="44" y="177" font-size="11" fill="#596273" font-weight="500" text-anchor="start">front</text><text x="345" y="177" font-size="11" fill="#596273" font-weight="500" text-anchor="end">rear</text><rect x="90" y="190" width="64" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="122.0" y="216.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="162" y="190" width="64" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="194.0" y="216.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">B</text><rect x="234" y="190" width="64" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="266.0" y="216.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">C</text><path d="M81 211 L44 211" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#queue-stack-arrow)"/><path d="M344 211 L301 211" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#queue-stack-arrow)"/><text x="43" y="257" font-size="12" fill="#03257B" font-weight="600" text-anchor="start">dequeue A</text><text x="346" y="257" font-size="12" fill="#03257B" font-weight="600" text-anchor="end">enqueue →</text><rect x="24" y="302" width="342" height="191" rx="24" fill="#F7F9FC" stroke="none"/><text x="43" y="332" font-size="13" fill="#0E5CF4" font-weight="600" text-anchor="start">STACK</text><text x="347" y="332" font-size="13" fill="#596273" font-weight="600" text-anchor="end">LIFO</text><rect x="132" y="354" width="126" height="34" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="376.0" font-size="15" fill="white" font-weight="600" text-anchor="middle">C · top</text><rect x="132" y="396" width="126" height="34" rx="12" fill="#EAF1FF" stroke="none"/><text x="195.0" y="418.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">B</text><rect x="132" y="438" width="126" height="34" rx="12" fill="#EAF1FF" stroke="none"/><text x="195.0" y="460.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">A</text><path d="M107 374 L107 342" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#queue-stack-arrow)"/><text x="43" y="376" font-size="12" fill="#03257B" font-weight="600" text-anchor="start">pop C</text><path d="M281 342 L281 374" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#queue-stack-arrow)"/><text x="290" y="366" font-size="12" fill="#03257B" font-weight="600" text-anchor="start">push</text><rect x="24" y="516" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="542" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">Queue는 A부터, Stack은 C부터</text></g></svg></div></figure><figure class="frame" data-id="bst-search"><figcaption class="frame-title">이진 탐색 트리 검색<span>bst-search · 4.0 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="576" viewBox="0 0 390 576" role="img" aria-labelledby="bst-search-title bst-search-desc"><title id="bst-search-title">이진 탐색 트리 검색</title><desc id="bst-search-desc">40, 20, 60, 10, 30, 50, 70으로 구성한 BST에서 30을 찾는다. 40보다 작아 왼쪽, 20보다 커 오른쪽, 30에서 성공한다. 균형이면 O(log n), 치우치면 O(n)이다.</desc><defs><marker id="bst-search-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">비교하면서 후보를 줄이기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">찾는 값 30을 현재 노드와 비교해요</text><rect x="24" y="116" width="342" height="245" rx="24" fill="#F7F9FC" stroke="none"/><path d="M195 176 L110 219" fill="none" stroke="#0E5CF4" stroke-width="2" stroke-linecap="round"/><path d="M195 176 L280 219" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><path d="M110 255 L67 298" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><path d="M110 255 L153 298" fill="none" stroke="#0E5CF4" stroke-width="2" stroke-linecap="round"/><path d="M280 255 L237 298" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><path d="M280 255 L323 298" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><circle cx="195" cy="158" r="21" fill="#03257B"/><text x="195" y="163" font-size="15" fill="white" font-weight="600" text-anchor="middle">40</text><circle cx="110" cy="237" r="21" fill="#03257B"/><text x="110" y="242" font-size="15" fill="white" font-weight="600" text-anchor="middle">20</text><circle cx="280" cy="237" r="21" fill="#EAF1FF"/><text x="280" y="242" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">60</text><circle cx="67" cy="316" r="21" fill="#EAF1FF"/><text x="67" y="321" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">10</text><circle cx="153" cy="316" r="21" fill="#03257B"/><text x="153" y="321" font-size="15" fill="white" font-weight="600" text-anchor="middle">30</text><circle cx="237" cy="316" r="21" fill="#EAF1FF"/><text x="237" y="321" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">50</text><circle cx="323" cy="316" r="21" fill="#EAF1FF"/><text x="323" y="321" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">70</text><rect x="24" y="385" width="100" height="45" rx="12" fill="#EAF1FF" stroke="none"/><text x="74.0" y="412.5" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">30 &lt; 40</text><path d="M133 407 L151 407" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#bst-search-arrow)"/><rect x="160" y="385" width="100" height="45" rx="12" fill="#EAF1FF" stroke="none"/><text x="210.0" y="412.5" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">30 &gt; 20</text><path d="M269 407 L286 407" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#bst-search-arrow)"/><rect x="294" y="385" width="72" height="45" rx="12" fill="#03257B" stroke="none"/><text x="330.0" y="412.5" font-size="13" fill="white" font-weight="600" text-anchor="middle">30 발견</text><rect x="24" y="455" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="481" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">균형이면 O(log n), 치우치면 O(n)</text><text x="24" y="527" font-size="12" fill="#596273" font-weight="500" text-anchor="start">정렬된 값 10 → 20 → 30 → 40 삽입 시</text><text x="24" y="550" font-size="12" fill="#596273" font-we " fill="#EAF1FF" stroke="none"/><text x="336.0" y="444.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">70</text><rect x="24" y="486" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="512" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">중위 순회 결과는 오름차순</text></g></svg></div></figure></div></section><section id="subject-1" aria-labelledby="heading-1"><h2 id="heading-1">운영체제<small>10개</small></h2><div class="frames"><svg class="connections" aria-hidden="true"></svg><figure class="frame" data-id="context-switch"><figcaption class="frame-title">문맥 전환<span>context-switch · 3.9 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="588" viewBox="0 0 390 588" role="img" aria-labelledby="context-switch-title context-switch-desc"><title id="context-switch-title">문맥 전환의 저장과 복구</title><desc id="context-switch-desc">A에서 B로 전환할 때 커널은 A의 프로그램 카운터와 레지스터를 PCB A에 저장하고 PCB B의 문맥을 CPU에 복구한다. 이후 B가 실행된다.</desc><defs><marker id="context-switch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">02 / OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">잠깐 저장, 이어서 실행</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">CPU가 작업을 바꿀 때 문맥을 보관해요</text><rect x="24" y="117" width="342" height="64" rx="20" fill="#F7F9FC" stroke="none"/><rect x="36" y="129" width="92" height="40" rx="12" fill="#03257B" stroke="none"/><text x="82" y="155" font-size="15" fill="white" font-weight="600" text-anchor="middle">A 실행</text><path d="M141 149 L241 149" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#context-switch-arrow)"/><text x="191" y="139" font-size="11" fill="#596273" font-weight="500" text-anchor="middle">전환</text><rect x="254" y="129" width="100" height="40" rx="12" fill="#EAF1FF" stroke="none"/><text x="304" y="155" font-size="15" fill="#0E5CF4" font-weight="600" text-anchor="middle">B 실행</text><rect x="24" y="208" width="342" height="260" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="235" font-size="10" fill="#596273" font-weight="600" text-anchor="start">KERNEL</text><rect x="139" y="255" width="112" height="66" rx="18" fill="#03257B" stroke="none"/><text x="195" y="283" font-size="20" fill="white" font-weight="700" text-anchor="middle">CPU</text><text x="195" y="305" font-size="11" fill="white" font-weight="500" text-anchor="middle">PC · 레지스터</text><path d="M165 329 L105 378" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#context-switch-arrow)"/><circle cx="120" cy="345" r="12" fill="#0E5CF4"/><text x="120" y="349" font-size="12" fill="white" font-weight="600" text-anchor="middle">1</text><text x="78" y="356" font-size="12" fill="#03257B" font-weight="600" text-anchor="start">저장</text><path d="M284 378 L232 330" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#context-switch-arrow)"/><circle cx="269" cy="345" r="12" fill="#0E5CF4"/><text x="269" y="349" font-size="12" fill="white" font-weight="600" text-anchor="middle">2</text><text x="288" y="356" font-size="12" fill="#03257B" font-weight="600" text-anchor="start">복구</text><rect x="43" y="389" width="138" height="60" rx="14" fill="white" stroke="#E3E6EB"/><text x="59" y="414" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">PCB A</text><text x="59" y="435" font-size="11" fill="#596273" font-weight="500" text-anchor="start">멈춘 위치 · 레지스터</text><rect x="209" y="389" width="138" height="60" rx="14" fill="#EAF1FF" stroke="#6194F8"/><text x="225" y="414" font-size="15" fill="#0E5CF4" font-weight="600" text-anchor="start">PCB B</text><text x="225" y="435" font-size="11" fill="#596273" font-weight="500" text-anchor="start">이어갈 위치 · 레지스터</text><rect x="24" y="490" width="342" height="46" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="518" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">A 문맥 저장 → B 문맥 복구 → B 실행</text><text x="24" y="563" font-size="13" fill="#596273" font-weight="500" text-anchor="start">A를 다시 실행할 때는 PCB A에서 복구</text></g></svg></div></figure><figure class="frame" data-id="race-condition"><figcaption class="frame-title">경쟁 상태<span>race-condition · 4.2 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="520" viewBox="0 0 390 520" role="img" aria-labelledby="race-condition-title race-condition-desc"><title id="race-condition-title">경쟁 상태와 갱신 유실</title><desc id="race-condition-desc">likes가 10일 때 A와 B가 모두 10을 읽고 각각 11을 저장하면 기대 12 대신 11이 된다. 실행 순서에 따라 결과가 달라지는 경쟁 상태다.</desc><defs><marker id="race-condition-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">같이 올렸는데, 하나만</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">likes++는 읽기·계산·저장으로 나뉘어요</text><rect x="24" y="116" width="342" height="44" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="143.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">공유 likes = 10</text><rect x="24" y="180" width="342" height="240" rx="14" fill="#F7F9FC" stroke="none"/><text x="36" y="204" font-size="12" fill="#0E5CF4" or="start">5</text><text x="90" y="374" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">11 계산</text><text x="234" y="374" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><path d="M34 384 L356 384" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="408" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">6</text><text x="90" y="408" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">11 저장</text><text x="234" y="408" font-size="12" fill="#03257B" font-weight="500" text-anchor="start"></text><rect x="24" y="451" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="477" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">기대 12 → 실제 11 · 갱신 한 번이 사라짐</text></g></svg></div></figure><figure class="frame" data-id="mutex"><figcaption class="frame-title">뮤텍스<span>mutex · 2.8 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="516" viewBox="0 0 390 516" role="img" aria-labelledby="mutex-title mutex-desc"><title id="mutex-title">Mutex의 획득과 반환</title><desc id="mutex-desc">A가 mutex를 획득해 likes를 변경하는 동안 B는 기다린다. 소유자인 A가 release하면 B가 acquire해 다음 임계 구역을 실행한다.</desc><defs><marker id="mutex-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">한 번에 하나만 들어가기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">Mutex는 잠근 쪽이 직접 풀어요</text><rect x="24" y="117" width="342" height="176" rx="24" fill="#F7F9FC" stroke="none"/><text x="45" aphore-title">카운팅 세마포어</title><desc id="semaphore-desc">DB 연결이 3개면 세마포어 S를 3으로 시작한다. 세 요청이 wait로 자원을 쓰면 S는 0이고 네 번째는 대기한다. 반납 signal 후 대기 요청이 자원을 사용할 수 있다.</desc><defs><marker id="semaphore-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">세 자원까지 함께 사용</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">Semaphore의 S는 남은 자원 수예요</text><rect x="24" y="117" width="342" height="148" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="145" font-size="13" fill="#596273" font-weight="600" text-anchor="start">DB 커넥션 풀 · 총 3개</text><rect x="43" y="167" width="88" height="51" rx="12" fill="#03257B" stroke="none"/><text x="87.0" y="197.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">사용 1</text><rect x="151" y="167" width="88" height="51" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="197.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">사용 2</text><rect x="259" y="167" width="88" height="51" rx="12" fill="#03257B" stroke="none"/><text x="303.0" y="197.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">사용 3</text><text x="195" y="244" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">3번 wait 후 · S = 0</text><rect x="24" y="286" width="130" height="48" rx="12" fill="#F2F3F5" stroke="none"/><text x="89.0" y="315.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">네 번째 요청</text><path d="M161 310 L211 310" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#semaphore-arrow)"/><rect x= ight="44" rx="12" fill="#EAF1FF" stroke="none"/><text x="195.0" y="401.0" font-size="12" fill="#03257B" font-weight="600" text-anchor="middle">커널</text><rect x="257" y="374" width="91" height="44" rx="12" fill="#03257B" stroke="none"/><text x="302.5" y="401.0" font-size="12" fill="white" font-weight="600" text-anchor="middle">B · recv</text><path d="M136 396 L149 396" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#ipc-arrow)"/><path d="M240 396 L253 396" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#ipc-arrow)"/><text x="195" y="455" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">pipe · socket · message queue</text><rect x="24" y="511" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="537" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">공유 메모리는 설정 뒤 직접 접근 · 동기화 필요</text></g></svg></div></figure></div></section><section id="subject-2" aria-labelledby="heading-2"><h2 id="heading-2">데이터베이스<small>6개</small></h2><div class="frames"><svg class="connections" aria-hidden="true"></svg><figure class="frame" data-id="transaction-lock"><figcaption class="frame-title">트랜잭션과 잠금<span>transaction-lock · 3.9 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="620" viewBox="0 0 390 620" role="img" aria-labelledby="transaction-lock-title transaction-lock-desc"><title id="transaction-lock-title">동시 갱신과 잠금</title><desc id="transaction-lock-desc">초기 재고 10을 두 주문이 동시에 읽고 각각 9로 쓰면 갱신이 손실된다. 수정할 값을 읽기 전에 잠금으로 보호하면 첫 주문은 9, 다음 주문은 8로 갱신한다.</desc><defs><marker id="transaction-lock-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">갱신을 잃지 않으려면</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">같은 재고를 고칠 때는 순서를 지켜요</text><rect x="24" y="116" width="342" height="166" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="144" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">잠금 없이 동시에</text><rect x="44" y="160" width="138" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="113.0" y="186.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">T1 · 10 읽기</text><rect x="208" y="160" width="138" height="42" rx="12" fill="#EAF1FF" stroke="none"/><text x="277.0" y="186.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">T2 · 10 읽기</text><path d="M113 207 L113 223" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#transaction-lock-arrow)"/><path d="M277 207 L277 223" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#transaction-lock-arrow)"/><rect x="44" y="230" width="138" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="113.0" y="251.0" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">9 쓰기</text><rect x="208" y="230" width="138" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="277.0" y="251.0" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">9 쓰기</text><text x="195" y="307" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">두 주문이 팔렸는데 재고는 9</text><rect x="24" y="332" width="342" height="200" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="360" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">수정 전 잠금 확보</text><circle cx="54" cy="390" r="12" fill="#0E5CF4"/><text x="54" y="394" font-size="12" fill="white" font-weight="600" text-anchor="middle">1</text><text x="78" y="395" font-size="13" fill="#03257B" font-weight="500" text-anchor="start">T1 · LOCK → 10 읽기 → 9 쓰기</text><path d="M54 406 L54 425" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#transaction-lock-arrow)"/><text x="78" y="427" font-size="12" fill="#596273" font-weight="500" text-anchor="start">T2는 잠금이 풀릴 때까지 대기</text><circle cx="54" cy="457" r="12" fill="#0E5CF4"/><text x="54" y="461" font-size="12" fill="white" font-weight="600" text-anchor="middle">2</text><text x="78" y="462" font-size="13" fill="#03257B" font-weight="500" text-anchor="start">T1 완료 · 잠금 해제</text><circle cx="54" cy="500" r="12" fill="#0E5CF4"/><text x="54" y="504" font-size="12" fill="white" font-weight="600" text-anchor="middle">3</text><text x="78" y="505" font-size="13" fill="#03257B" font-weight="500" text-anchor="start">T2 · LOCK → 9 읽기 → 8 쓰기</text><rect x="24" y="553" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="579" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">같은 값을 읽기 전에 잠금으로 순서 보장</text></g></svg></div></figure><figure class="frame" data-id="index-search"><figcaption class="frame-title">인덱스 검색<span>index-search · 3.1 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="646" viewBox="0 0 390 646" role="img" aria-labelledby="index-search-title index-search-desc"><title id="index-search-title">인덱스에서 실제 행으로</title><desc id="index-search-desc">notes의 member 이름 이도현을 정렬된 이름 인덱스에서 찾은 뒤 해당 행의 위치로 이동한다. 실제 위치 표현은 DBMS에 따라 다르며 InnoDB 보조 인덱스는 PK로 클러스터형 인덱스를 다시 탐색한다.</desc><defs><marker id="index-search-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">이름에서 행으로 바로</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">정렬된 인덱스가 데이터 위치를 알려줘요</text><rect x="24" y="117" width="342" height="47" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="145.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">WHERE name = &#x27;이도현&#x27;</text><text x="24" y="201" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">이름 인덱스</text><rect x="24" y="220" width="342" height="134" rx="20" fill="#F7F9FC" stroke="none"/><text x="44" y="247" font-size="12" fill="#596273" font-weight="500" text-anchor="start">정렬된 검색 키</text><text x="44" y="286" font-size="20" fill="#0E5CF4" font-weight="600" text-anchor="start">이도현</text><text x="44" y="322" font-size="13" fill="#596273" font-weight="500" text-anchor="start">찾은 항목의 행 위치를 따라가기</text><path d="M195 365 L195 399" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#index-search-arrow)"/><text x="24" y="428" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">member 테이블의 해당 행</text><rect x="24" y="448" width="342" height="70" rx="14" fill="#F7F9FC" stroke="none"/><text x="36" y="472" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">name</text><text x="171" y="472" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="start">그 밖의 컬럼</text><path d="M34 482 L356 482" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="506" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">이도현</text><text x="171" y="506" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">해당 회원의 데이터</text><rect x="24" y="550" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="576" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">인덱스 탐색 → 행 위치 → 필요한 데이터</text><text x="24" y="619" font-size="12" fill="#596273" font-weight="500" text-anchor="start">InnoDB 보조 인덱스는 PK로 한 번 더 탐색</text></g></svg></div></figure><figure class="frame" data-id="bplus-tree"><figcaption class="frame-title">B+ 트리<span>bplus-tree · 3.7 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="610" viewBox="0 0 390 610" role="img" aria-labelledby="bplus-tree-title bplus-tree-desc"><title id="bplus-tree-title">B+tree의 단건과 범위 검색</title><desc id="bplus-tree-desc">루트의 구분 키 30과 42로 리프를 찾는다. 리프는 18,24 / 30,36 / 42,51 순으로 연결된다. notes의 age 30 이상 조건은 30부터 연결된 리프를 따라 36,42,51을 순서대로 읽는다.</desc><defs><marker id="bplus-tree-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">찾고, 옆으로 이어 읽기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">B+tree는 정렬된 리프가 연결되어 있어요</text><rect x="114" y="120" width="162" height="46" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="148.0" font-size="18" fill="white" font-weight="600" text-anchor="middle">30  |  42</text><text x="195" y="191" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">루트 · 길 안내용 키</text><path d="M195 207 L75 245" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#bplus-tree-arrow)"/><path d="M195 207 L195 245" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#bplus-tree-arrow)"/><path d="M195 207 L315 245" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#bplus-tree-arrow)"/><rect x="24" y="259" width="102" height="60" rx="12" fill="#F2F3F5" stroke="none"/><text x="75.0" y="294.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">18 | 24</text><text x="75" y="342" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">키 + 위치</text><rect x="144" y="259" width="102" height="60" rx="12" fill="#EAF1FF" stroke="none"/><text x="195.0" y="294.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">30 | 36</text><text x="195" y="342" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">키 + 위치</text><rect x="264" y="259" width="102" height="60" rx="12" fill="#EAF1FF" stroke="none"/><text x="315.0" y="294.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">42 | 51</text><text x="315" y="342" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">키 + 위치</text><path d="M129 289 L139 289" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#bplus-tree-arrow)"/><path d="M249 289 L259 289" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#bplus-tree-arrow)"/><text x="24" y="384" font-size="13" fill="#596273" font-weight="500" text-anchor="start">리프 · 실제 데이터 위치는 여기에</text><rect x="24" y="410" width="342" height="109" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="440" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">범위 검색 · age ≥ 30</text><text x="44" y="478" font-size="20" fill="#0E5CF4" font-weight="600" text-anchor="start">30 → 36 → 42 → 51</text><text x="44" y="502" font-size="12" fill="#596273" font-weight="500" text-anchor="start">첫 리프를 찾은 뒤 옆으로 계속 읽기</text><rect x="24" y="542" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="568" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">단건은 아래로, 범위는 리프를 따라 옆으로</text></g></svg></div></figure><figure class="frame" data-id="db-keys"><figcaption class="frame-title">데이터베이스 키<span>db-keys · 3.1 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="596" viewBox="0 0 390 596" role="img" aria-labelledby="db-keys-title db-keys-desc"><title id="db-keys-title">기본키와 후보키, 복합키</title><desc id="db-keys-desc">employee의 emp_no와 email은 각각 후보키이며 emp_no를 PK로 고르면 email은 대체키다. name과 dept는 중복될 수 있다. order_item의 order_id와 product_id를 함께 묶으면 복합키가 된다.</desc><defs><marker id="db-keys-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">행을 구분하는 키</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">유일한 후보 중 하나를 대표로 골라요</text><rect x="24" y="117" width="342" height="220" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="146" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">employee 테이블</text><rect x="44" y="165" width="138" height="50" rx="12" fill="#03257B" stroke="none"/><text x="113.0" y="195.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">emp_no</text><rect x="208" y="165" width="138" height="50" rx="12" fill="#EAF1FF" stroke="none"/><text x="277.0" y="195.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">email</text><text x="113" y="243" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">기본키 PK</text><text x="277" y="243" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">대체키</text><text x="195" y="277" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">둘 다 후보키 · 유일성 + 최소성</text><text x="44" y="313" font-size="12" fill="#596273" font-weight="500" text-anchor="start">name · dept는 중복될 수 있어요</text><text x="24" y="376" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">두 컬럼을 묶는 복합키</text><rect x="24" y="395" width="342" height="108" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="424" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">order_item</text><rect x="44" y="442" width="137" height="42" rx="12" fill="#03257B" stroke="none"/><text x="112.5" y="468.0" font-size="15" fill="white" font-weight="600" text-anchor="middle">order_id</text><rect x="209" y="442" width="137" height="42" rx="12" fill="#03257B" stroke="none"/><text x="277.5" y="468.0" font-size="15" fill="white" font-weight="600" text-anchor="middle">product_id</text><text x="195" y="469" font-size="17" fill="#0E5CF4" font-weight="600" text-anchor="middle">+</text><rect x="24" y="528" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="554" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">함께 묶어야 주문의 상품 한 행을 식별</text></g></svg></div></figure><figure class="frame" data-id="er-relationship"><figcaption class="frame-title">테이블 관계<span>er-relationship · 3.8 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="662" viewBox="0 0 390 662" role="img" aria-labelledby="er-relationship-title er-relationship-desc"><title id="er-relationship-title">1대다와 다대다 관계</title><desc id="er-relationship-desc">author와 book은 author_id를 이용한 1대다 관계다. member와 club의 다대다 관계는 membership 연결 테이블로 분해하고 member_id와 club_id 두 외래키를 복합 기본키로 사용한다. joined_at은 관계의 속성이다.</desc><defs><marker id="er-relationship-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">관계를 테이블로 잇기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">N:M은 연결 테이블 하나로 풀어요</text><text x="24" y="131" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">1:N · 작가 한 명, 여러 책</text><rect x="24" y="150" width="142" height="60" rx="12" fill="#03257B" stroke="none"/><text x="95.0" y="185.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">author</text><rect x="224" y="150" width="142" height="60" rx="12" fill="#EAF1FF" stroke="none"/><text x="295.0" y="185.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">book</text><path d="M172 180 L217 180" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#er-relationship-arrow)"/><text x="195" y="165" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">1:N</text><text x="44" y="237" font-size="12" fill="#596273" font-weight="500" text-anchor="start">author_id PK</text><text x="244" y="237" font-size="12" fill="#596273" font-weight="500" text-anchor="start">author_id FK</text><text x="24" y="292" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">N:M · 회원과 동호회</text><rect x="24" y="312" width="142" height="52" rx="12" fill="#03257B" stroke="none"/><text x="95.0" y="343.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">member</text><rect x="224" y="312" width="142" height="52" rx="12" fill="#03257B" stroke="none"/><text x="295.0" y="343.0" font-size="17" fill="white" font-weight="600" text-anchor="middle">club</text><text x="95" y="389" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">member_id PK</text><text x="295" y="389" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">club_id PK</text><path d="M95 404 L125 441" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#er-relationship-arrow)"/><path d="M295 404 L265 441" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#er-relationship-arrow)"/><text x="79" y="425" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">1:N</text><text x="311" y="425" font-size="12" fill="#0E5CF4" font-weight="600" text-anchor="middle">1:N</text><rect x="44" y="453" width="302" height="117" rx="20" fill="#F7F9FC" stroke="none"/><text x="195" y="482" font-size="18" fill="#0E5CF4" font-weight="600" text-anchor="middle">membership</text><text x="195" y="514" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">member_id FK · club_id FK</text><text x="195" y="544" font-size="12" fill="#596273" font-weight="500" text-anchor="middle">둘을 묶어 PK · 가입일 joined_at</text><rect x="24" y="593" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="619" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">관계 자체의 정보도 연결 테이블에 저장</text></g></svg></div></figure><figure class="frame" data-id="join-types"><figcaption class="frame-title">조인 결과<span>join-types · 4.7 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="678" viewBox="0 0 390 678" role="img" aria-labelledby="join-types-title join-types-desc"><title id="join-types-title">INNER JOIN과 LEFT JOIN</title><desc id="join-types-desc">notes의 author와 book을 author_id로 연결한다. INNER JOIN은 한지우의 파이썬 입문과 알고리즘 노트, 오세린의 시스템 설계 세 행이다. author LEFT JOIN은 책이 없는 문도윤의 NULL 행을 더해 네 행이다. author가 NULL인 작자 미상 필사본은 둘 다 제외된다.</desc><defs><marker id="join-types-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><tex "600" text-anchor="start">책 제목</text><path d="M34 418 L356 418" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="442" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">한지우</text><text x="154" y="442" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">파이썬 입문</text><path d="M34 452 L356 452" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="476" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">한지우</text><text x="154" y="476" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">알고리즘 노트</text><path d="M34 486 L356 486" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="510" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">오세린</text><text x="154" y="510" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">시스템 설계</text><path d="M34 520 L356 520" fill="none" stroke="#E3E6EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="544" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">문도윤</text><text x="154" y="544" font-size="12" fill="#03257B" font-weight="500" text-anchor="start">NULL · 책 없음</text><rect x="24" y="581" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="607" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">문도윤은 LEFT JOIN에서만 결과에 남아요</text><text x="24" y="651" font-size="12" fill="#596273" font-weight="500" text-anchor="start">작가 없는 필사본은 두 결과 모두에 없음</text></g></svg></div></figure></div></section><section id="subject-3" aria-labelledby="heading-3"><h2 id="heading-3">네트워크<small>7개</small></h2><div class="frames"><svg class="connections" aria-hidden="true"></svg><figure class="frame" data-id="encapsulation"><figcaption class="frame-title">캡슐화와 역캡슐화<span>encapsulation · 4.9 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="634" viewBox="0 0 390 634" role="img" aria-labelledby="encapsulation-title encapsulation-desc"><title id="encapsulation-title">캡슐화와 역캡슐화</title><desc id="encapsulation-desc">TCP/IP 4계층에서 HTTP 데이터 앞에 TCP, IP, Ethernet 헤더가 붙고 링크 트레일러 FCS도 추가된다. 수신 측은 역순으로 제거한다.</desc><defs><marker id="encapsulation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / ENCAPSULATION</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">헤더를 붙이고, 다시 벗기기</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">계층마다 제어 정보를 더해 전송해요</text><text x="24" y="127" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">송신 · 캡슐화</text><text x="24" y="173" font-size="12" fill="#596273" font-weight="600" text-anchor="start">응용</text><rect x="91" y="151" width="160" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="171.0" y="174.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">HTTP 데이터</text><path d="M333 191 L333 210" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#encapsulation-arrow)"/><text x="24" y="239" font-size="12" fill="#596273" font-weight="600" text-anchor="start">전송</text><rect x="91" y="217" width="55" height="36" rx="12" fill="#03257B" stroke="none"/><text x="118.5" y="240.0" font-size="11" fill="white" font-weight="600" text-anchor="middle">TCP</text><rect x="149" y="217" width="160" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="229.0" y="240.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">HTTP 데이터</text><path d="M333 257 L333 276" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#encapsulation-arrow)"/><text x="24" y="305" font-size="12" fill="#596273" font-weight="600" text-anchor="start">인터넷</text><rect x="91" y="283" width="42" height="36" rx="12" fill="#0E5CF4" stroke="none"/><text x="112.0" y="306.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">IP</text><rect x="136" y="283" width="55" height="36" rx="12" fill="#03257B" stroke="none"/><text x="163.5" y="306.0" font-size="11" fill="white" font-weight="600" text-anchor="middle">TCP</text><rect x="194" y="283" width="118" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="253.0" y="306.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">데이터</text><path d="M333 323 L333 342" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#encapsulation-arrow)"/><text x="24" y="371" font-size="12" fill="#596273" font-weight="600" text-anchor="start">링크</text><rect x="91" y="349" width="42" height="36" rx="12" fill="#6194F8" stroke="none"/><text x="112.0" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">Eth</text><rect x="136" y="349" width="35" height="36" rx="12" fill="#0E5CF4" stroke="none"/><text x="153.5" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">IP</text><rect x="174" y="349" width="46" height="36" rx="12" fill="#03257B" stroke="none"/><text x="197.0" y="372.0" font-size="11" fill="white" font-weight="600" text-anchor="middle">TCP</text><rect x="223" y="349" width="80" height="36" rx="12" fill="#EAF1FF" stroke="none"/><text x="263.0" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">데이터</text><rect x="306" y="349" width="42" height="36" rx="12" fill="#6194F8" stroke="none"/><text x="327.0" y="372.0" font-size="11" fill="#03257B" font-weight="600" text-anchor="middle">FCS</text><text x="24" y="438" font-size="13" fill="#596273" font-weight="500" text-anchor="start">비트 신호로 전송</text><path d="M160 434 L3  y="146" font-size="19" fill="#0E5CF4" font-weight="700" text-anchor="start">TCP</text><text x="44" y="170" font-size="12" fill="#596273" font-weight="500" text-anchor="start">먼저 온 C는 B를 기다림</text><rect x="44" y="186" width="78" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="83.0" y="207.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="138" y="186" width="78" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="177.0" y="207.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">C</text><rect x="232" y="186" width="78" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="271.0" y="207.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">B</text><text x="44" y="237" font-size="11" fill="#596273" font-weight="500" text-anchor="start">앱 전달</text><text x="145" y="243" font-size="19" fill="#03257B" font-weight="600" text-anchor="start">A → B → C</text><rect x="24" y="305" width="342" height="164" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="334" font-size="19" fill="#0E5CF4" font-weight="700" text-anchor="start">UDP</text><text x="44" y="358" font-size="12" fill="#596273" font-weight="500" text-anchor="start">도착한 순서 그대로 앱이 받을 수 있음</text><rect x="44" y="374" width="78" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="83.0" y="395.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="138" y="374" width="78" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="177.0" y="395.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">C</text><rect x="232" y="374" width="78" height="32" rx="12" fill="#EAF1FF" stroke="none"/><text x="271.0" y="395.0" font-size="15" fill="#03257B" font-weight="600" text-anchor="middle">B</text><text x="44" y="425" font-size="11" fill="#596273" font-weight="500" text-anchor="start">앱 전달</text><text x="145" y="431" font-size="19" fill="#03257B" font-weight="600" text-anchor="st HTTP 메시지<span>http-message · 3.0 KB</span></figcaption><div class="artboard"><svg xmlns="http://www.w3.org/2000/svg" width="390" height="634" viewBox="0 0 390 634" role="img" aria-labelledby="http-message-title http-message-desc"><title id="http-message-title">HTTP 요청과 응답 메시지</title><desc id="http-message-desc">notes의 GET /books?id=7 요청과 HTTP/1.1 200 OK 응답을 사용한다. GET의 조회 조건은 URL 쿼리로, POST 데이터는 요청 바디로 보낼 수 있으며 둘 다 HTTPS가 필요하다.</desc><defs><marker id="http-message-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="11" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / HTTP</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">요청과 응답을 읽는 순서</text><text x="24" y="89" font-size="13" fill="#596273" font-weight="500" text-anchor="start">시작 줄 → 헤더 → 빈 줄 → 바디</text><rect x="24" y="117" width="342" height="155" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="145" font-size="15" fill="#0E5CF4" font-weight="600" text-anchor="start">요청</text><text x="44" y="174" font-size="15" fill="#03257B" font-weight="600" text-anchor="start">GET /books?id=7 HTTP/1.1</text><text x="44" y="203" font-size="13" fill="#596273" font-weight="500" text-anchor="start">Host: shop.example.com</text><text x="44" y="228" font-size="13" fill="#596273" font-weight="500" text-anchor="start">Accept: application/json</text><text x="44" y="251" font-size="12" fill="#596273" font-weight="500" text-anchor="start">빈 줄 뒤, 필요한 경우 바디</text><rect x="24" y="292" width="342" height="154" rx="24" fill="#F7F9FC" stroke="none"/><text x="44" y="320" font-size="15" fill="#0E5CF4" font-weight="600" text-anchor="start">응답</text><text x="44" y="348" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">HTTP/1.1 200 OK</text><text x="44" y="376" font-size="13" fill="#596273" font-weight="500" text-anchor="start">Content-Type: application/json</text><text x="44" y="419" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">{&quot;id&quot;: 7, &quot;title&quot;: &quot;...&quot;}</text><text x="24" y="480" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">데이터를 싣는 위치</text><rect x="24" y="496" width="160" height="50" rx="12" fill="#EAF1FF" stroke="none"/><text x="104.0" y="526.0" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">GET · URL 쿼리</text><rect x="206" y="496" width="160" height="50" rx="12" fill="#EAF1FF" stroke="none"/><text x="286.0" y="526.0" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">POST · 요청 바디</text><rect x="24" y="567" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="593" font-size="13" fill="#03257B" font-weight="600" text-anchor="middle">POST도 HTTPS가 없으면 평문 전송</text></g></svg></div></figure></div></section><footer>프로세스 메모리는 운영체제에, 교착 상태는 운영체제에 한 번씩 배치했습니다. 두 개념은 다른 과목에서도 함께 사용합니다.<br><a href="STYLE.md">스타일 가이드</a></footer></main><script>function connect(){document.querySelectorAll('.frames').forEach(group=>{const svg=group.querySelector('.connections'),rect=group.getBoundingClientRect(),cards=[...group.querySelectorAll('.frame')];svg.setAttribute('width',rect.width);svg.setAttribute('height',rect.height);svg.setAttribute('viewBox',`0 0 ${rect.width} ${rect.height}`);let d='';for(let i=0;i<cards.length-1;i++){const a=cards[i].getBoundingClientRect(),b=cards[i+1].getBoundingClientRect();let x,y,X,Y,p;if(Math.abs(a.top-b.top)<2){x=a.right-rect.left+4;y=a.top-rect.top+43+(a.height-43)/2;X=b.left-rect.left-6;Y=y;p=`M${x} ${y} H${X} M${X-7} ${Y-5} L${X} ${Y} L${X-7} ${Y+5}`}else{x=a.left-rect.left+a.width/2;y=a.bottom-rect.top+4;X=b.left-rect.left+b.width/2;Y=b.top-rect.top-10;const mid=Y-40;p=`M${x} ${y} V${mid-12} Q${x} ${mid} ${x-12} ${mid} H${X+12} Q${X} ${mid} ${X} ${mid+12} V${Y} M${X-5} ${Y-7} L${X} ${Y} L${X+5} ${Y-7}`}d+=`<path d="${p}"/><circle cx="${x}" cy="${y}" r="3" fill="#F2F3F5"/>`}svg.innerHTML=`<g fill="none" stroke="#18A0FB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${d}</g>`})}window.addEventListener('resize',connect);document.fonts.ready.then(connect);connect();</script></body></html>
