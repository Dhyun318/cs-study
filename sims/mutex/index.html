<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mutex lock과 unlock</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_kit/kit.css">
<style>
/* 위 줄: lock 칸과 공유 변수 칸. 잠기면 lock 칸이, 값이 바뀌면 변수 칸이 파란 테두리 */
.top2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cell { min-width: 0; display: grid; gap: 2px; padding: 10px 12px; border: 1.5px dashed var(--grey-200); border-radius: 14px; }
.cell.on { border-style: solid; border-color: var(--blue); background: var(--blue-50); }
.cell small { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.cell b { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 700; }
.cell span { font-size: 13px; font-weight: 600; color: var(--ink-2); }

/* 대기 줄: 잠긴 동안 기다리는 thread가 순서대로 선다 */
.que { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-height: 36px; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip { height: 28px; padding: 0 10px; border-radius: 8px; background: var(--grey-100); font-size: 13px; font-weight: 700; line-height: 28px; color: var(--grey-700); }
.chip.wake { background: var(--blue-50); color: var(--accent-text); }

/* thread 줄: 이름 + 상태, 아래에 acquire, 임계 구역, release 세 칸 */
.ths { display: grid; gap: 8px; margin-top: 4px; }
.tr { min-width: 0; padding: 8px 10px 10px; border: 1px solid var(--grey-200); border-radius: 12px; }
.tr.inside { border-color: var(--blue); }
.tr h3 { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin: 0 0 6px; font-size: 15px; font-weight: 700; }
.st { height: 22px; padding: 0 8px; border-radius: 6px; background: var(--grey-100); font-size: 12px; font-weight: 700; line-height: 22px; color: var(--grey-700); }
.st.inside { background: var(--blue); color: #fff; }
.st.woken, .st.done { background: var(--blue-50); color: var(--accent-text); }
.segs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0; padding: 0; list-style: none; }
.segs li { min-width: 0; height: 34px; display: grid; place-items: center; border: 1px solid var(--grey-200); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--mute); }
.segs li.done { border-color: transparent; background: var(--grey-100); color: var(--ink-2); }
.segs li.now { border-color: var(--blue); background: var(--blue-50); color: var(--ink); font-weight: 700; }
.segs li.wait { border-style: dashed; border-color: var(--grey-700); color: var(--grey-700); }

/* 직접 해 보기: 고르는 칸 */
.sim-row select { flex: 1; min-width: 0; height: 48px; padding: 0 10px; border: 1px solid var(--grey-200); border-radius: 12px; background: var(--bg); font-size: 15px; }
.sim-row select:focus { border-color: var(--accent-text); }
.sim-err { min-height: 20px; margin-top: 8px; font-size: 14px; font-weight: 600; color: var(--red); }
</style>
</head>
<body>
<div class="sim-page">
  <header class="sim-top">
    <a class="sim-back" href="../index.html" aria-label="시뮬레이션 목록"></a>
    <h1>Mutex lock과 unlock</h1>
  </header>
  <a class="sim-q" data-q="03-os/6"><span><small>관련 질문</small><b><span class="sim-star" aria-label="별 1개">1</span>lock으로 임계 구역 지키기</b></span></a>

  <section class="sim-card"><div id="sim-stage"></div></section>

  <form class="sim-try" id="try">
    <h2>직접 해 보기</h2>
    <p>thread 수와 먼저 acquire를 시도할 thread를 고르면, lock을 주고받는 과정을 처음부터 보여 줘요.</p>
    <div class="sim-row">
      <select name="n" aria-label="thread 수">
        <option value="2">thread 2개</option>
        <option value="3">thread 3개</option>
      </select>
      <select name="first" aria-label="먼저 acquire를 시도할 thread">
        <option value="1">thread 1 먼저</option>
        <option value="2">thread 2 먼저</option>
        <option value="3">thread 3 먼저</option>
      </select>
    </div>
    <div class="sim-row">
      <input name="v" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" placeholder="hits 시작 값 0~99" aria-label="hits 시작 값(숫자)">
      <button class="sim-btn">실행</button>
      <button type="button" class="sim-btn ghost" onclick="Sim.reset()">처음부터</button>
    </div>
    <p class="sim-err" id="err" role="alert"></p>
  </form>
</div>

<script src="../_kit/kit.js"></script>
<script>
// 예시: 공유 변수 hits를 thread마다 한 번씩 올린다. 임계 구역 = hits++
const SEGS = ['acquire()', 'hits++', 'release()'];
const STATE = { ready: '준비', blocked: 'block 중', woken: '깨어남', inside: '임계 구역', done: '끝' };
const LOCK = '<svg class="sim-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z M8 11v-4a4 4 0 1 1 8 0v4"/></svg>';
const OPEN = '<svg class="sim-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2z M8 11v-5a4 4 0 0 1 8 0"/></svg>';

// thread n개, first가 먼저 acquire, hits 시작 값 v0으로 모든 단계를 만든다
function build(n, first, v0) {
  const ids = [1, 2, 3].slice(0, n);
  const order = [first, ...ids.filter(t => t !== first)];
  const s = { owner: null, queue: [], hits: v0, st: {}, prog: {} };
  ids.forEach(t => { s.st[t] = 'ready'; s.prog[t] = 0; });
  const steps = [];
  // 지금 상태를 복사해 한 단계로 쌓는다
  const push = (caption, now = null, extra = {}) => steps.push({
    caption, now, v0, n, ids, ...extra,
    owner: s.owner, queue: [...s.queue], hits: s.hits, st: { ...s.st }, prog: { ...s.prog },
  });

  push(`thread가 ${n}개 있고 모두 변수 hits 값을 하나씩 올려요. lock은 열려 있어요.`);
  // 가장 먼저 시도한 thread는 열린 lock을 바로 잡는다
  const a = order[0];
  s.owner = a; s.st[a] = 'inside'; s.prog[a] = 1;
  push(`thread ${a} 먼저 acquire() 호출. lock이 열려 있어서 바로 잠그고 들어가요.`, [a, 1]);
  // 나머지는 잠긴 lock 앞에서 block되어 대기 줄에 선다
  order.slice(1).forEach(t => {
    s.st[t] = 'blocked'; s.queue.push(t);
    push(`thread ${t} acquire() 호출. lock이 잠겨 있어서 block, 대기 줄에 서요.`, [t, 1]);
  });
  // 차례대로: 들어가기, hits++, release
  order.forEach((t, k) => {
    if (k > 0) {
      s.queue.shift(); s.owner = t; s.st[t] = 'inside'; s.prog[t] = 1;
      push(`깨어난 thread ${t} 차례. acquire()에 성공해서 lock을 잠그고 들어가요.`, [t, 1]);
    }
    s.hits += 1; s.prog[t] = 2;
    push(`thread ${t} 임계 구역에서 hits++ 실행. 혼자 들어와 있어서 안전해요. (${s.hits - 1} → ${s.hits})`, [t, 2]);
    s.owner = null; s.st[t] = 'done'; s.prog[t] = 3;
    const next = s.queue[0];
    if (next) s.st[next] = 'woken';
    push(next ? `thread ${t} release() 호출. lock을 잡은 쪽이 직접 풀어요. 맨 앞 대기 thread를 깨워요.`
      : `thread ${t} release() 호출. lock을 잡은 쪽이 직접 풀어요. 대기하는 thread는 이제 없어요.`, [t, 3]);
  });
  push(`모두 끝났어요. hits ${v0} → ${s.hits}, thread ${n}개가 한 번에 하나씩 차례로 들어갔어요.`, null, { final: true });
  return steps;
}

// 그리기: lock 칸 + hits 칸 + 대기 줄 + thread 줄
function render(s, stage) {
  const now = s.now, inside = s.ids.find(t => s.st[t] === 'inside');
  const row = t => {
    const seg = SEGS.map((name, i) => {
      const cls = now && now[0] === t && now[1] === i + 1 ? 'now'
        : s.prog[t] > i ? 'done'
        : i === 0 && s.st[t] === 'blocked' ? 'wait' : '';
      return `<li class="${cls}">${name}</li>`;
    }).join('');
    return `<div class="tr${s.st[t] === 'inside' ? ' inside' : ''}">
      <h3>thread ${t}<span class="st ${s.st[t]}">${STATE[s.st[t]]}</span></h3>
      <ol class="segs">${seg}</ol></div>`;
  };
  stage.innerHTML = `
    <div class="top2">
      <div class="cell${s.owner ? ' on sim-pop' : ''}"><small>lock</small><b>${s.owner ? LOCK + '잠김' : OPEN + '열림'}</b><span>${s.owner ? `소유 thread ${s.owner}` : '소유자 없음'}</span></div>
      <div class="cell${now && now[1] === 2 ? ' on' : ''}"><small>공유 변수 hits</small><b class="num${now && now[1] === 2 ? ' sim-pop' : ''}">${s.hits}</b><span>${inside ? `안에 thread ${inside}` : '임계 구역 비어 있음'}</span></div>
    </div>
    <div class="que"><span>대기 줄</span>${s.queue.length ? s.queue.map((t, i) => `<span class="chip${i === 0 && !s.owner ? ' wake' : ''}">thread ${t}</span>`).join('') : '<span>비어 있음</span>'}</div>
    <div class="ths">${s.ids.map(row).join('')}</div>`;
}

// 직접 해 보기: 고른 thread 수, 먼저 시도할 thread, 시작 값으로 처음부터 만든다
document.getElementById('try').addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, err = document.getElementById('err');
  const n = Number(f.n.value), first = Number(f.first.value), raw = f.v.value.trim();
  // 선택은 2~3, 1~3 안의 정수만, 시작 값은 비우면 지금 값, 넣었다면 0~99 숫자만
  if (![2, 3].includes(n) || ![1, 2, 3].includes(first)) { err.textContent = 'thread 수와 먼저 시도할 thread를 목록에서 골라 주세요.'; return; }
  if (first > n) { err.textContent = '고른 thread가 전체 수보다 커요. 수를 늘리거나 다른 thread를 골라 주세요.'; return; }
  if (raw && !/^\d{1,2}$/.test(raw)) { err.textContent = '시작 값은 0에서 99 사이 숫자로 넣어 주세요.'; return; }
  err.textContent = '';
  Sim.load(build(n, first, raw ? Number(raw) : Sim.step().v0));
  f.v.value = '';
});

Sim.start({ steps: build(2, 1, 8), render });
</script>
</body>
</html>
