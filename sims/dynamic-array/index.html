<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dynamic Array 크기 늘리기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_kit/kit.css">
<style>
/* 그림 틀: 위 줄(넣을 값, 시간 표시) + 배열 하나 또는 둘. 높이가 덜 흔들리게 최소 높이를 둔다 */
.da { min-height: 250px; }
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px; min-height: 30px; margin-bottom: 8px; }
.inc { padding: 4px 10px; border-radius: 8px; background: var(--grey-100); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.inc b { margin-left: 4px; font-size: 15px; color: var(--grey-900); }
.tag { margin-left: auto; padding: 4px 10px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.tag.fast { background: var(--blue-50); color: var(--accent-text); }
.tag.slow { background: var(--cta); color: #fff; }
.tag.err { background: var(--red-50); color: var(--red); }

/* 배열 한 개: 이름 + size/용량 + 칸들 */
.arr { margin-top: 10px; }
.arr.freed { opacity: .45; }
.hd { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; margin-bottom: 6px; font-size: 13px; }
.hd b { font-weight: 700; color: var(--grey-900); }
.hd span { font-weight: 600; color: var(--ink-2); }
.cs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 40px)); gap: 8px 4px; }
.v { height: 40px; display: grid; place-items: center; border: 1px dashed var(--grey-200); border-radius: 10px; font-size: 16px; font-weight: 700; }
.v.on { border-style: solid; background: var(--grey-100); }
.v.src { border-color: var(--blue); background: var(--blue-50); }
.v.hl { border-style: solid; border-color: var(--blue); background: var(--blue-50); }
.i { margin-top: 2px; text-align: center; font-size: 11px; font-weight: 600; color: var(--mute); }
</style>
</head>
<body>
<div class="sim-page">
  <header class="sim-top">
    <a class="sim-back" href="../index.html" aria-label="시뮬레이션 목록"></a>
    <h1>Dynamic Array 크기 늘리기</h1>
  </header>
  <a class="sim-q" data-q="02-data-structure/2"><span><small>관련 질문</small><b>Dynamic Array와 resize</b></span></a>

  <section class="sim-card"><div id="sim-stage"></div></section>

  <form class="sim-try" id="try">
    <h2>직접 해 보기</h2>
    <p>0부터 99까지 숫자를 넣어 보세요. 칸이 남으면 바로 쓰고, 가득 차면 배열을 키워요. 16칸까지 보여 줘요.</p>
    <div class="sim-row">
      <input name="v" inputmode="numeric" pattern="[0-9]{1,2}" maxlength="2" required placeholder="예: 5" aria-label="넣을 값(숫자)">
      <button class="sim-btn">넣기</button>
      <button type="button" class="sim-btn ghost" onclick="Sim.reset()">처음부터</button>
    </div>
  </form>
</div>

<script src="../_kit/kit.js"></script>
<script>
const MAX = 16; // 이 화면이 보여 주는 가장 큰 용량

// 단계 하나: main = 지금 쓰는 배열, next = 새로 만드는 배열, 나머지는 강조와 표시
// hl = 방금 쓴 칸, copy = 옮긴 개수, freed = main이 해제된 옛 배열, inc = 넣으려는 값, tag = [종류, 글자]
const S = (caption, main, o = {}) => ({ caption, main, ...o });
const A = (cap, items) => ({ cap, items });

// 지금 보이는 단계에서 실제로 쓰이는 배열 (해제된 옛 배열이면 새 배열 쪽)
const live = s => (s.freed ? s.next : s.main);

// 값 하나를 끝에 넣는 단계들: 칸이 남으면 한 단계, 가득 차면 resize 과정까지
function appendSteps(a, v) {
  const n = a.items.length;
  if (n < a.cap) {
    return [S('값 하나를 끝 칸에 바로 써요. 한 칸만 쓰니 빨라요.', A(a.cap, [...a.items, v]), { hl: n, tag: ['fast', 'append O(1)'] })];
  }
  if (a.cap >= MAX) {
    return [S(`이 화면은 ${MAX}칸까지만 보여 줘요. 처음부터 눌러서 다시 해 봐요.`, a)];
  }
  const big = A(a.cap * 2, []), half = Math.ceil(n / 2);
  return [
    S('다음 값을 넣으려는데 칸이 없어요. 배열이 가득 찼어요.', a, { inc: v }),
    S('두 배 크기인 새 배열을 따로 만들어요. 처음엔 비어 있어요.', a, { next: big, inc: v, tag: ['slow', 'resize 시작'] }),
    S('기존 값을 앞에서부터 하나씩 새 배열로 복사해요.', a, { next: A(big.cap, a.items.slice(0, half)), copy: half, inc: v, tag: ['slow', '복사 O(n)'] }),
    S('전부 옮겼어요. 값이 많을수록 복사 시간도 늘어나요.', a, { next: A(big.cap, a.items), copy: n, inc: v, tag: ['slow', '복사 O(n)'] }),
    S('기존 배열은 해제해요. 이제부터 새 배열을 써요.', a, { next: A(big.cap, a.items), freed: true, inc: v, tag: ['slow', '복사 O(n)'] }),
    S('넣으려던 값을 끝 칸에 써요. 이번 append만 느렸던 거예요.', A(big.cap, [...a.items, v]), { hl: n, tag: ['slow', '이번 한 번만 O(n)'] }),
  ];
}

// 처음 보여 줄 단계: 용량 4에서 네 번째 값, 다섯 번째 값(resize), 정리
const base = appendSteps(A(4, [7, 2, 9, 4]), 6);
const STEPS = [
  S('용량 4칸 배열에 값이 세 개 들어 있어요. 한 칸이 비었어요.', A(4, [7, 2, 9])),
  S('네 번째 값은 빈 칸에 바로 써요. 한 칸만 쓰니 빨라요.', A(4, [7, 2, 9, 4]), { hl: 3, tag: ['fast', 'append O(1)'] }),
  ...base,
  S('복사는 가끔만 일어나요. 길게 보면 평균 O(1) 수준으로 봐요.', A(8, [7, 2, 9, 4, 6]), { tag: ['fast', '평균 O(1)'] }),
];

// 칸 하나: 값(또는 빈 칸) + 아래 index
function cell(a, i, cls) {
  const on = i < a.items.length;
  return `<div><div class="v num${on ? ' on' : ''}${cls ? ' ' + cls : ''}">${on ? a.items[i] : ''}</div><div class="i num">${i}</div></div>`;
}

// 배열 하나 그리기. cls(i)가 칸 강조를 정한다
function arr(label, a, cls = () => '', freed = false) {
  const cells = Array.from({ length: a.cap }, (_, i) => cell(a, i, cls(i))).join('');
  return `<div class="arr${freed ? ' freed' : ''}">
    <div class="hd"><b>${label}</b><span class="num">size ${a.items.length}, 용량 ${a.cap}</span></div>
    <div class="cs" style="--n:${Math.min(a.cap, MAX / 2)}">${cells}</div></div>`;
}

// 그리기: 위 줄(넣을 값, 시간) + 기존 배열 + 새 배열
function render(s, stage) {
  const old = s.next ? (s.freed ? '기존 배열(해제됨)' : '기존 배열') : '배열';
  stage.innerHTML = `<div class="da">
    <div class="top">${s.inc === undefined ? '' : `<span class="inc">넣을 값<b class="num">${s.inc}</b></span>`}${s.tag ? `<span class="tag ${s.tag[0]}">${s.tag[1]}</span>` : ''}</div>
    ${arr(old, s.main, i => (i === s.hl ? 'hl sim-pop' : i < (s.copy || 0) ? 'src' : ''), s.freed)}
    ${s.next ? arr('새 배열', s.next, i => (i < (s.copy || 0) ? 'src sim-pop' : '')) : ''}</div>`;
}

// 직접 해 보기: 지금 쓰는 배열에 값을 넣는 단계를 만들어 자동 재생
document.getElementById('try').addEventListener('submit', e => {
  e.preventDefault();
  const raw = e.target.v.value.trim(), v = Number(raw), a = live(Sim.step());
  // 숫자 0부터 99만 받는다
  if (!/^[0-9]{1,2}$/.test(raw) || !Number.isInteger(v)) {
    Sim.load([S('0부터 99까지 숫자만 넣을 수 있어요.', a, { tag: ['err', '넣을 수 없는 값'] })]);
    return;
  }
  Sim.load(appendSteps(a, v));
  Sim.play(true);
  e.target.reset();
});

Sim.start({ steps: STEPS, render });
</script>
</body>
</html>
