<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paging 주소 매핑</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../_kit/kit.css">
<style>
/* 세 열: 논리 page, page table, 물리 frame. 사이 빈 공간에 선을 그린다 */
.pg { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; column-gap: 24px; align-items: start; }
.col, .blk { display: grid; gap: 4px; min-width: 0; }
.col { align-content: start; }
.blk + .blk { margin-top: 10px; }
.h { height: 20px; font-size: 12px; font-weight: 600; line-height: 20px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h.on { color: var(--accent-text); }

/* 칸: process A는 파랑, B는 주황 바탕 */
.c { height: 28px; display: flex; align-items: center; justify-content: center; border: 1px solid var(--grey-200); border-radius: 8px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pA { background: var(--blue-50); border-color: var(--blue); }
.pB { background: var(--orange-100); border-color: var(--orange-100); color: var(--grey-900); }
.sel { border-color: var(--accent-text); box-shadow: inset 0 0 0 1px var(--accent-text); }

/* page table 줄: page 번호 | frame 번호 */
.t { display: grid; grid-template-columns: 1fr 1fr; padding: 0; background: var(--bg); overflow: hidden; }
.t span, .t i { display: grid; place-items: center; height: 100%; font-style: normal; }
.t span { background: var(--grey-100); color: var(--ink-2); }
.t i { border-left: 1px solid var(--grey-200); }
.t .no { color: var(--mute); font-weight: 600; }

/* frame 칸: 왼쪽 frame 번호, 오른쪽 들어 있는 page */
.f { justify-content: space-between; padding: 0 8px; font-size: 12px; }
.f u { text-decoration: none; font-weight: 600; color: var(--ink-2); }
.f.pA, .f.pB { font-weight: 700; }
.f.pA u, .f.pB u { color: var(--grey-700); }
.f.free { border-style: dashed; background: var(--bg); }
.f.free em { font-style: normal; font-weight: 600; color: var(--mute); }

/* 선: 칸 위에 겹쳐 그린다 */
.ln { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.ln path { fill: none; stroke: var(--accent-text); stroke-width: 2; stroke-linecap: round; }
.ln .ah { fill: var(--accent-text); stroke: none; }

.sim-row select { flex: 1; min-width: 0; height: 48px; padding: 0 6px; border: 1px solid var(--grey-200); border-radius: 12px; background: var(--bg); font-size: 15px; }
.sim-row select:focus { border-color: var(--accent-text); }
</style>
</head>
<body>
<div class="sim-page">
  <header class="sim-top">
    <a class="sim-back" href="../index.html" aria-label="시뮬레이션 목록"></a>
    <h1>Paging 주소 매핑</h1>
  </header>
  <a class="sim-q" data-q="03-os/8"><span><small>관련 질문</small><b>Paging과 page table</b></span></a>

  <section class="sim-card"><div id="sim-stage"></div></section>

  <form class="sim-try" id="try">
    <h2>직접 해 보기</h2>
    <p>논리 page를 고르면 page table 줄을 거쳐 물리 frame까지 가는 선이 그려져요.</p>
    <div class="sim-row">
      <select name="pg" aria-label="따라갈 논리 page"></select>
      <button class="sim-btn">따라가기</button>
      <button type="button" class="sim-btn ghost" onclick="Sim.reset()">처음부터</button>
    </div>
  </form>
</div>

<script src="../_kit/kit.js"></script>
<script>
// 예시 데이터: map[i] = i번 page가 들어가는 frame 번호. 물리 메모리는 frame 20번부터 27번까지 8개
const FRAMES = [20, 21, 22, 23, 24, 25, 26, 27];
const P1 = { id: 'A', lab: '논리 메모리', tlab: 'page table', map: [24, 21, 26, 22, 25], solo: true };
const PA = { id: 'A', lab: 'A 논리 메모리', tlab: 'A page table', map: [23, 20, 26] };
const PB = { id: 'B', lab: 'B 논리 메모리', tlab: 'B page table', map: [21, 27, 24, 22] };

// 앞에서 k개 page만 frame에 넣은 상태 (table 줄은 넣은 page만 채워진다)
const put = (p, k) => ({ ...p, table: p.map.map((f, i) => (i < k ? f : null)) });
// 단계: procs 상태 + focus(강조할 열) + sel(선을 그릴 page 'A:2') + half(table까지만) + news(방금 들어온 것) + free(빈 frame 강조)
const st = (caption, procs, o = {}) => ({ caption, procs, ...o });

const ONE = [
  st('process가 보는 논리 메모리는 page 0번부터 4번까지 쭉 이어져 있어요.', [put(P1, 0)], { focus: 'l' }),
  st('물리 메모리는 page와 같은 크기의 frame 8개로 잘라 두어요. 번호는 20번부터예요.', [put(P1, 0)], { focus: 'f' }),
  st('page 0번은 빈 frame 아무 데나 넣어요. 24번 frame에 넣고 table에 적어요.', [put(P1, 1)], { focus: 't', sel: ['A:0'], news: ['A:0'] }),
  st('다음 page 1번은 21번 frame에 넣었어요. 앞 page 옆이 아니어도 돼요.', [put(P1, 2)], { focus: 't', sel: ['A:1'], news: ['A:1'] }),
  st('나머지 page 2, 3, 4번도 빈 frame에 하나씩 넣었어요. 순서가 뒤섞였어요.', [put(P1, 5)], { news: ['A:2', 'A:3', 'A:4'] }),
  st('논리 공간에서 이웃인 2번과 3번 page는 26번과 22번 frame으로 가요.', [put(P1, 5)], { sel: ['A:2', 'A:3'] }),
  st('그래도 process는 0번부터 4번까지 이어진 공간으로 봐요. 연결은 table이 해요.', [put(P1, 5)], { sel: ['A:0', 'A:1', 'A:2', 'A:3', 'A:4'] }),
];

const TWO = [
  st('process 둘은 각자 page 0번부터 시작하는 자기만의 논리 공간을 가져요.', [put(PA, 0), put(PB, 0)], { focus: 'l' }),
  st('하지만 물리 메모리는 하나예요. frame 8개를 두 process가 나눠 써요.', [put(PA, 0), put(PB, 0)], { focus: 'f' }),
  st('process A 쪽 page 3개를 빈 frame에 넣고, A 전용 table에 적어요.', [put(PA, 3), put(PB, 0)], { focus: 't', news: ['A:0', 'A:1', 'A:2'] }),
  st('process B 쪽 page 4개도 남은 frame에 넣어요. 두 process의 page가 섞여요.', [put(PA, 3), put(PB, 4)], { focus: 't', news: ['B:0', 'B:1', 'B:2', 'B:3'] }),
  st('page 번호가 같아도 table이 달라요. 0번 page는 A 쪽이 23번, B 쪽이 21번이에요.', [put(PA, 3), put(PB, 4)], { sel: ['A:0', 'B:0'] }),
  st('2번 page도 table을 거치면 A 쪽은 26번, B 쪽은 24번 frame으로 가요.', [put(PA, 3), put(PB, 4)], { sel: ['A:2', 'B:2'] }),
  st('25번 frame은 비어 있어요. 어느 process의 page든 들어올 수 있어요.', [put(PA, 3), put(PB, 4)], { focus: 'f', free: true }),
];

// 고르기 목록: process 구성이 바뀔 때(모드 전환)만 다시 만든다
let optKey = '';
function fillOptions(procs) {
  const key = procs.map(p => p.id + p.map.length).join();
  if (key === optKey) return;
  optKey = key;
  const sel = document.querySelector('#try select');
  sel.replaceChildren(...procs.flatMap(p => p.map.map((_, i) =>
    new Option(`${p.solo ? '논리' : `${p.id} 쪽`} page ${i}번`, `${p.id}:${i}`))));
}

// 그리기: 세 열을 만들고, 고른 page마다 논리 칸 → table 줄 → frame 선을 잇는다
function render(s, stage) {
  fillOptions(s.procs);
  const sel = new Set(s.sel || []), news = new Set(s.news || []);
  const frameOwner = {};
  s.procs.forEach(p => p.table.forEach((f, i) => { if (f !== null) frameOwner[f] = { p, i }; }));
  const hd = (txt, c) => `<div class="h${s.focus === c ? ' on' : ''}">${txt}</div>`;
  const pop = k => (news.has(k) ? ' sim-pop' : '');
  const lastOf = p => p.map.map((_, i) => i);

  const left = s.procs.map(p => `<div class="blk">${hd(p.lab, 'l')}${lastOf(p).map(i => {
    const k = `${p.id}:${i}`;
    return `<div class="c num p${p.id}${sel.has(k) ? ' sel' : ''}" data-l="${k}">page ${i}</div>`;
  }).join('')}</div>`).join('');

  const mid = s.procs.map(p => `<div class="blk">${hd(p.tlab, 't')}${lastOf(p).map(i => {
    const k = `${p.id}:${i}`, f = p.table[i];
    return `<div class="c t num${sel.has(k) ? ' sel' : ''}${pop(k)}" data-t="${k}"><span>${i}</span>${f === null ? '<i class="no">?</i>' : `<i>${f}</i>`}</div>`;
  }).join('')}</div>`).join('');

  const right = `<div class="blk">${hd('물리 메모리', 'f')}${FRAMES.map(f => {
    const o = frameOwner[f];
    const hit = o && sel.has(`${o.p.id}:${o.i}`) && !s.half;
    const who = o ? `${o.p.solo ? '' : o.p.id + ' '}page ${o.i}` : '';
    return `<div class="c f num ${o ? 'p' + o.p.id : 'free'}${hit || (!o && s.free) ? ' sel' : ''}${o ? pop(`${o.p.id}:${o.i}`) : ''}" data-f="${f}"><u>${f}</u>${o ? who : '<em>빈 칸</em>'}</div>`;
  }).join('')}</div>`;

  stage.innerHTML = `<div class="pg"><div class="col">${left}</div><div class="col">${mid}</div><div class="col">${right}</div>
    <svg class="ln" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L8 4L0 8z"/></marker></defs></svg></div>`;

  // 선: 각 칸의 위치를 재서 곡선으로 잇는다
  const pg = stage.querySelector('.pg'), svg = pg.querySelector('svg'), box = pg.getBoundingClientRect();
  const pt = (el, side) => { const r = el.getBoundingClientRect(); return [(side === 'r' ? r.right : r.left) - box.left, r.top + r.height / 2 - box.top]; };
  const curve = ([x1, y1], [x2, y2]) => { const d = (x2 - x1) / 2; return `<path d="M${x1} ${y1}C${x1 + d} ${y1} ${x2 - d} ${y2} ${x2} ${y2}" marker-end="url(#ah)"/>`; };
  sel.forEach(k => {
    const [id, i] = k.split(':'), p = s.procs.find(q => q.id === id), f = p.table[i];
    const l = pg.querySelector(`[data-l="${k}"]`), t = pg.querySelector(`[data-t="${k}"]`);
    svg.insertAdjacentHTML('beforeend', curve(pt(l, 'r'), pt(t, 'l')));
    if (!s.half && f !== null) svg.insertAdjacentHTML('beforeend', curve(pt(t, 'r'), pt(pg.querySelector(`[data-f="${f}"]`), 'l')));
  });
}

// 직접 해 보기: 고른 page에서 table 줄, frame 순서로 선이 그려지는 두 단계를 만든다
document.getElementById('try').addEventListener('submit', e => {
  e.preventDefault();
  const full = Sim.step().procs.length === 1 ? [put(P1, 5)] : [put(PA, 3), put(PB, 4)];
  const [id, n] = e.target.pg.value.split(':'), i = Number(n);
  const p = full.find(q => q.id === id);
  if (!p || !Number.isInteger(i) || i < 0 || i >= p.map.length) {
    Sim.load([st('목록에 없는 page예요. 목록에서 골라 주세요.', full)]);
    return;
  }
  const k = `${id}:${i}`, who = p.solo ? '논리' : `process ${id} 쪽`;
  Sim.load([
    st(`${who} page ${i}번을 골랐어요. table에서 같은 번호 줄을 찾아요.`, full, { focus: 't', sel: [k], half: true }),
    st(`table ${i}번 줄에 ${p.map[i]}번 frame이 적혀 있어요. 그 frame으로 가요.`, full, { focus: 'f', sel: [k] }),
  ]);
  Sim.play(true);
});

addEventListener('resize', () => render(Sim.step(), document.getElementById('sim-stage')));
Sim.start({ modes: { '한 process': ONE, '두 process': TWO }, render });
</script>
</body>
</html>
