<svg xmlns="http://www.w3.org/2000/svg" width="390" height="610" viewBox="0 0 390 610" role="img" aria-labelledby="title desc"><title id="title">B+tree의 단건과 범위 검색</title><desc id="desc">루트의 구분 키 30과 42로 리프를 찾는다. 리프는 18,24 / 30,36 / 42,51 순으로 연결된다. notes의 age 30 이상 조건은 30부터 연결된 리프를 따라 36,42,51을 순서대로 읽는다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">찾고, 옆으로 이어 읽기</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">B+tree는 정렬된 리프가 연결되어 있어요</text><rect x="114" y="120" width="162" height="46" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="148.0" font-size="18" fill="white" font-weight="600" text-anchor="middle">30  |  42</text><text x="195" y="191" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">루트 · 길 안내용 키</text><path d="M195 207 L75 245" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M195 207 L195 245" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M195 207 L315 245" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="259" width="102" height="60" rx="12" fill="#F2F4F6" stroke="none"/><text x="75.0" y="294.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">18 | 24</text><text x="75" y="342" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">키 + 위치</text><rect x="144" y="259" width="102" height="60" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="294.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">30 | 36</text><text x="195" y="342" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">키 + 위치</text><rect x="264" y="259" width="102" height="60" rx="12" fill="#EAF1FE" stroke="none"/><text x="315.0" y="294.0" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">42 | 51</text><text x="315" y="342" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">키 + 위치</text><path d="M129 289 L139 289" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M249 289 L259 289" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="24" y="384" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">리프 · 실제 데이터 위치는 여기에</text><rect x="24" y="410" width="342" height="109" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="440" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">범위 검색 · age ≥ 30</text><text x="44" y="478" font-size="20" fill="#0E5CF4" font-weight="600" text-anchor="start">30 → 36 → 42 → 51</text><text x="44" y="502" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">첫 리프를 찾은 뒤 옆으로 계속 읽기</text><rect x="24" y="542" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="568" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">단건은 아래로, 범위는 리프를 따라 옆으로</text></g></svg>