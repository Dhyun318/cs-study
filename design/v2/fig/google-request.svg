<svg xmlns="http://www.w3.org/2000/svg" width="390" height="680" viewBox="0 0 390 680" role="img" aria-labelledby="title desc"><title id="title">웹 페이지 요청의 전체 흐름</title><desc id="desc">URL 해석, DNS 조회, TCP와 TLS 연결, HTTP 요청, 서버 처리와 응답, 브라우저 파싱과 리소스 추가 요청 후 렌더링 순서다. 캐시나 연결 재사용은 일부 단계를 생략할 수 있다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">네트워크 / REQUEST</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">주소 입력부터 화면까지</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">HTTPS · TCP 기반 연결의 일반적인 흐름</text><rect x="24" y="119" width="342" height="65" rx="8" fill="#FFFFFF" stroke="none"/><circle cx="48" cy="142" r="12" fill="#0E5CF4"/><text x="48" y="146" font-size="14" fill="white" font-weight="600" text-anchor="middle">1</text><text x="72" y="146" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">URL 해석</text><text x="72" y="168" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">https · www.google.com · 경로</text><path d="M48 186 L48 195" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="198" width="342" height="65" rx="8" fill="#FFFFFF" stroke="none"/><circle cx="48" cy="221" r="12" fill="#0E5CF4"/><text x="48" y="225" font-size="14" fill="white" font-weight="600" text-anchor="middle">2</text><text x="72" y="225" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">DNS 조회</text><text x="72" y="247" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">호스트 이름 → IP 주소</text><path d="M48 265 L48 274" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="277" width="342" height="65" rx="8" fill="#FFFFFF" stroke="none"/><circle cx="48" cy="300" r="12" fill="#0E5CF4"/><text x="48" y="304" font-size="14" fill="white" font-weight="600" text-anchor="middle">3</text><text x="72" y="304" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">TCP 연결 + TLS</text><text x="72" y="326" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">연결 설정 후 암호화 채널 준비</text><path d="M48 344 L48 353" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="356" width="342" height="65" rx="8" fill="#FFFFFF" stroke="none"/><circle cx="48" cy="379" r="12" fill="#0E5CF4"/><text x="48" y="383" font-size="14" fill="white" font-weight="600" text-anchor="middle">4</text><text x="72" y="383" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">HTTP 요청</text><text x="72" y="405" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">TCP → IP → Ethernet 캡슐화</text><path d="M48 423 L48 432" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="435" width="342" height="65" rx="8" fill="#FFFFFF" stroke="none"/><circle cx="48" cy="458" r="12" fill="#0E5CF4"/><text x="48" y="462" font-size="14" fill="white" font-weight="600" text-anchor="middle">5</text><text x="72" y="462" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">서버 처리와 응답</text><text x="72" y="484" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">역캡슐화 · 요청 처리 · HTTP 응답</text><path d="M48 502 L48 511" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="514" width="342" height="65" rx="8" fill="#FFFFFF" stroke="none"/><circle cx="48" cy="537" r="12" fill="#0E5CF4"/><text x="48" y="541" font-size="14" fill="white" font-weight="600" text-anchor="middle">6</text><text x="72" y="541" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">브라우저 렌더링</text><text x="72" y="563" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">HTML 파싱 · CSS/JS/이미지 추가 요청</text><rect x="24" y="612" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="638" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">DNS·연결은 캐시와 재사용에 따라 생략 가능</text></g></svg>