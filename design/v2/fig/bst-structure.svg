<svg xmlns="http://www.w3.org/2000/svg" width="390" height="556" viewBox="0 0 390 556" role="img" aria-labelledby="title desc"><title id="title">이진 탐색 트리 구조와 순회</title><desc id="desc">notes의 40,20,60,10,30,50,70 트리를 쓴다. 왼쪽 서브트리는 루트보다 작고 오른쪽 서브트리는 크다. 중위 순회는 10,20,30,40,50,60,70 순서다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">왼쪽은 작게, 오른쪽은 크게</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">모든 서브트리에 같은 규칙을 적용해요</text><rect x="24" y="116" width="342" height="245" rx="8" fill="#FFFFFF" stroke="none"/><path d="M195 176 L110 219" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M195 176 L280 219" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M110 255 L67 298" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M110 255 L153 298" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M280 255 L237 298" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M280 255 L323 298" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><circle cx="195" cy="158" r="21" fill="#03257B"/><text x="195" y="163" font-size="16" fill="white" font-weight="600" text-anchor="middle">40</text><circle cx="110" cy="237" r="21" fill="#EAF1FE"/><text x="110" y="242" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">20</text><circle cx="280" cy="237" r="21" fill="#EAF1FE"/><text x="280" y="242" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">60</text><circle cx="67" cy="316" r="21" fill="#EAF1FE"/><text x="67" y="321" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">10</text><circle cx="153" cy="316" r="21" fill="#EAF1FE"/><text x="153" y="321" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">30</text><circle cx="237" cy="316" r="21" fill="#EAF1FE"/><text x="237" y="321" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">50</text><circle cx="323" cy="316" r="21" fill="#EAF1FE"/><text x="323" y="321" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">70</text><text x="110" y="350" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">40보다 작은 값</text><text x="280" y="350" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="middle">40보다 큰 값</text><text x="24" y="397" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">중위 순회 · 왼쪽 → 자신 → 오른쪽</text><rect x="33" y="418" width="42" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="54.0" y="444.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">10</text><rect x="80" y="418" width="42" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="101.0" y="444.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">20</text><rect x="127" y="418" width="42" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="148.0" y="444.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">30</text><rect x="174" y="418" width="42" height="42" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="444.0" font-size="16" fill="white" font-weight="600" text-anchor="middle">40</text><rect x="221" y="418" width="42" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="242.0" y="444.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">50</text><rect x="268" y="418" width="42" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="289.0" y="444.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">60</text><rect x="315" y="418" width="42" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="336.0" y="444.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">70</text><rect x="24" y="486" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="512" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">중위 순회 결과는 오름차순</text></g></svg>