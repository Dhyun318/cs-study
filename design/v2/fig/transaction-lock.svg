<svg xmlns="http://www.w3.org/2000/svg" width="390" height="620" viewBox="0 0 390 620" role="img" aria-labelledby="title desc"><title id="title">동시 갱신과 잠금</title><desc id="desc">초기 재고 10을 두 주문이 동시에 읽고 각각 9로 쓰면 갱신이 손실된다. 수정할 값을 읽기 전에 잠금으로 보호하면 첫 주문은 9, 다음 주문은 8로 갱신한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">갱신을 잃지 않으려면</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">같은 재고를 고칠 때는 순서를 지켜요</text><rect x="24" y="116" width="342" height="166" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="144" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">잠금 없이 동시에</text><rect x="44" y="160" width="138" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="113.0" y="186.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">T1 · 10 읽기</text><rect x="208" y="160" width="138" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="277.0" y="186.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">T2 · 10 읽기</text><path d="M113 207 L113 223" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M277 207 L277 223" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="44" y="230" width="138" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="113.0" y="251.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">9 쓰기</text><rect x="208" y="230" width="138" height="32" rx="12" fill="#EAF1FE" stroke="none"/><text x="277.0" y="251.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">9 쓰기</text><text x="195" y="307" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">두 주문이 팔렸는데 재고는 9</text><rect x="24" y="332" width="342" height="200" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="360" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">수정 전 잠금 확보</text><circle cx="54" cy="390" r="12" fill="#0E5CF4"/><text x="54" y="394" font-size="14" fill="white" font-weight="600" text-anchor="middle">1</text><text x="78" y="395" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">T1 · LOCK → 10 읽기 → 9 쓰기</text><path d="M54 406 L54 425" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="78" y="427" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">T2는 잠금이 풀릴 때까지 대기</text><circle cx="54" cy="457" r="12" fill="#0E5CF4"/><text x="54" y="461" font-size="14" fill="white" font-weight="600" text-anchor="middle">2</text><text x="78" y="462" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">T1 완료 · 잠금 해제</text><circle cx="54" cy="500" r="12" fill="#0E5CF4"/><text x="54" y="504" font-size="14" fill="white" font-weight="600" text-anchor="middle">3</text><text x="78" y="505" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">T2 · LOCK → 9 읽기 → 8 쓰기</text><rect x="24" y="553" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="579" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">같은 값을 읽기 전에 잠금으로 순서 보장</text></g></svg>