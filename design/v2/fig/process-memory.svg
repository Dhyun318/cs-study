<svg xmlns="http://www.w3.org/2000/svg" width="390" height="607" viewBox="0 0 390 607" role="img" aria-labelledby="title desc"><title id="title">프로세스 메모리와 스레드 공유</title><desc id="desc">프로세스마다 독립된 Code, Data, Heap, Stack 주소 공간이 있다. 같은 프로세스의 스레드는 Code, Data, Heap을 공유하지만 각자 Stack, PC 및 register 실행 문맥을 가진다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">같은 프로세스, 나뉜 실행</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">Code·Data·Heap은 공유하고 Stack은 따로</text><rect x="24" y="116" width="342" height="193" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="145" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">프로세스의 메모리 영역</text><rect x="42" y="161" width="96" height="29" rx="12" fill="#03257B" stroke="none"/><text x="90.0" y="180.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">Code</text><text x="154" y="181" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">실행 명령어</text><rect x="42" y="195" width="96" height="29" rx="12" fill="#03257B" stroke="none"/><text x="90.0" y="214.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">Data</text><text x="154" y="215" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">전역 · static 변수</text><rect x="42" y="229" width="96" height="29" rx="12" fill="#03257B" stroke="none"/><text x="90.0" y="248.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">Heap</text><text x="154" y="249" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">실행 중 요청한 공간</text><rect x="42" y="263" width="96" height="29" rx="12" fill="#03257B" stroke="none"/><text x="90.0" y="282.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">Stack</text><text x="154" y="283" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">함수 호출 · 지역 변수</text><rect x="24" y="334" width="342" height="179" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="361" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">하나의 프로세스 안</text><rect x="44" y="377" width="302" height="39" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="401.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">공유: Code · Data · Heap</text><rect x="44" y="432" width="139" height="59" rx="12" fill="#03257B" stroke="none"/><text x="113.5" y="466.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">Thread A</text><rect x="207" y="432" width="139" height="59" rx="12" fill="#03257B" stroke="none"/><text x="276.5" y="466.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">Thread B</text><text x="113" y="509" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">Stack · PC · register</text><text x="276" y="509" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">Stack · PC · register</text><rect x="24" y="539" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="565" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">서로 다른 프로세스는 주소 공간이 독립</text></g></svg>