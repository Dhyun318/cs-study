<svg xmlns="http://www.w3.org/2000/svg" width="390" height="516" viewBox="0 0 390 516" role="img" aria-labelledby="title desc"><title id="title">Mutex의 획득과 반환</title><desc id="desc">A가 mutex를 획득해 likes를 변경하는 동안 B는 기다린다. 소유자인 A가 release하면 B가 acquire해 다음 임계 구역을 실행한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">한 번에 하나만 들어가기</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">Mutex는 잠근 쪽이 직접 풀어요</text><rect x="24" y="117" width="342" height="176" rx="8" fill="#FFFFFF" stroke="none"/><text x="45" y="145" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">임계 구역</text><rect x="47" y="167" width="130" height="47" rx="12" fill="#03257B" stroke="none"/><text x="112.0" y="195.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">A · lock 획득</text><rect x="47" y="225" width="130" height="45" rx="12" fill="#EAF1FE" stroke="none"/><text x="112.0" y="252.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">likes++</text><path d="M112 214 L112 224" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="216" y="167" width="128" height="47" rx="12" fill="#F2F4F6" stroke="none"/><text x="280.0" y="195.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">B · 대기</text><path d="M213 190 L184 190" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="318" width="342" height="44" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="345.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">1  A acquire → 공유 값 변경</text><rect x="24" y="377" width="342" height="44" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="404.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">2  A release → B acquire</text><path d="M195 365 L195 375" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="450" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="476" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">lock을 가진 주체만 release</text></g></svg>