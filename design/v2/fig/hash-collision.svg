<svg xmlns="http://www.w3.org/2000/svg" width="390" height="464" viewBox="0 0 390 464" role="img" aria-labelledby="title desc"><title id="title">해시 충돌과 체이닝</title><desc id="desc">7개 버킷에서 키 1032와 1039는 나머지가 모두 3이다. 버킷 3의 연결 리스트에 두 항목을 저장한다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">01 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">같은 칸, 다른 키</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">충돌이 나도 연결해서 함께 보관해요</text><rect x="24" y="116" width="342" height="150" rx="8" fill="#FFFFFF" stroke="none"/><rect x="42" y="136" width="110" height="44" rx="12" fill="white" stroke="none"/><rect x="42" y="202" width="110" height="44" rx="12" fill="white" stroke="none"/><text x="97" y="164" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">key 1032</text><text x="97" y="230" font-size="17" fill="#03257B" font-weight="600" text-anchor="middle">key 1039</text><path d="M160 158 L208 181" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round"/><path d="M160 224 L208 201" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round"/><rect x="211" y="164" width="72" height="54" rx="16" fill="#03257B" stroke="none"/><text x="247" y="187" font-size="16" fill="white" font-weight="600" text-anchor="middle">hash</text><text x="247" y="206" font-size="14" fill="white" font-weight="600" text-anchor="middle">k % 7</text><path d="M292 191 L326 191" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="339" y="197" font-size="20" fill="#0E5CF4" font-weight="700" text-anchor="middle">3</text><rect x="90" y="282" width="210" height="28" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="301" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">1032 % 7 = 1039 % 7 = 3</text><text x="24" y="341" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">버킷 3</text><text x="366" y="341" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="end">SEPARATE CHAINING</text><rect x="24" y="359" width="46" height="48" rx="12" fill="#03257B" stroke="none"/><text x="47" y="389" font-size="18" fill="white" font-weight="600" text-anchor="middle">3</text><path d="M72 383 L101 383" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="108" y="359" width="104" height="48" rx="12" fill="#EAF1FE" stroke="none"/><text x="160" y="389" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">1032</text><path d="M215 383 L242 383" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="250" y="359" width="104" height="48" rx="12" fill="#EAF1FE" stroke="none"/><text x="302" y="389" font-size="18" fill="#03257B" font-weight="600" text-anchor="middle">1039</text><text x="24" y="439" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">한 버킷의 연결 리스트에 두 항목을 저장</text></g></svg>