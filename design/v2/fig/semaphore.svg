<svg xmlns="http://www.w3.org/2000/svg" width="390" height="504" viewBox="0 0 390 504" role="img" aria-labelledby="title desc"><title id="title">카운팅 세마포어</title><desc id="desc">DB 연결이 3개면 세마포어 S를 3으로 시작한다. 세 요청이 wait로 자원을 쓰면 S는 0이고 네 번째는 대기한다. 반납 signal 후 대기 요청이 자원을 사용할 수 있다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">세 자원까지 함께 사용</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">Semaphore의 S는 남은 자원 수예요</text><rect x="24" y="117" width="342" height="148" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="145" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">DB 커넥션 풀 · 총 3개</text><rect x="43" y="167" width="88" height="51" rx="12" fill="#03257B" stroke="none"/><text x="87.0" y="197.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">사용 1</text><rect x="151" y="167" width="88" height="51" rx="12" fill="#03257B" stroke="none"/><text x="195.0" y="197.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">사용 2</text><rect x="259" y="167" width="88" height="51" rx="12" fill="#03257B" stroke="none"/><text x="303.0" y="197.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">사용 3</text><text x="195" y="244" font-size="16" fill="#0E5CF4" font-weight="600" text-anchor="middle">3번 wait 후 · S = 0</text><rect x="24" y="286" width="130" height="48" rx="12" fill="#F2F4F6" stroke="none"/><text x="89.0" y="315.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">네 번째 요청</text><path d="M161 310 L211 310" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="220" y="286" width="146" height="48" rx="12" fill="#FFE0B0" stroke="none"/><text x="293.0" y="315.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">S = 0 · 대기</text><rect x="24" y="363" width="342" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="389.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">signal로 반납 → 대기 요청에 기회</text><rect x="24" y="436" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="462" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">동시에 3개 허용 · 남는 자원이 없으면 대기</text></g></svg>