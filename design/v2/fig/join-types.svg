<svg xmlns="http://www.w3.org/2000/svg" width="390" height="678" viewBox="0 0 390 678" role="img" aria-labelledby="title desc"><title id="title">INNER JOIN과 LEFT JOIN</title><desc id="desc">notes의 author와 book을 author_id로 연결한다. INNER JOIN은 한지우의 파이썬 입문과 알고리즘 노트, 오세린의 시스템 설계 세 행이다. author LEFT JOIN은 책이 없는 문도윤의 NULL 행을 더해 네 행이다. author가 NULL인 작자 미상 필사본은 둘 다 제외된다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">03 / DATABASE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">짝이 없는 행도 남길까</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">왼쪽을 author로 두고 결과를 비교해요</text><text x="24" y="127" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">같은 조건 · author_id로 연결</text><text x="24" y="164" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">INNER JOIN · 짝이 있는 세 행</text><rect x="24" y="183" width="342" height="138" rx="8" fill="#FFFFFF" stroke="none"/><text x="36" y="207" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">작가</text><text x="154" y="207" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">책 제목</text><path d="M34 217 L356 217" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="241" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">한지우</text><text x="154" y="241" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">파이썬 입문</text><path d="M34 251 L356 251" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="275" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">한지우</text><text x="154" y="275" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">알고리즘 노트</text><path d="M34 285 L356 285" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="309" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">오세린</text><text x="154" y="309" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">시스템 설계</text><text x="24" y="365" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">LEFT JOIN · 왼쪽 작가는 모두</text><rect x="24" y="384" width="342" height="172" rx="8" fill="#FFFFFF" stroke="none"/><text x="36" y="408" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">작가</text><text x="154" y="408" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">책 제목</text><path d="M34 418 L356 418" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="442" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">한지우</text><text x="154" y="442" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">파이썬 입문</text><path d="M34 452 L356 452" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="476" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">한지우</text><text x="154" y="476" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">알고리즘 노트</text><path d="M34 486 L356 486" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="510" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">오세린</text><text x="154" y="510" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">시스템 설계</text><path d="M34 520 L356 520" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><text x="36" y="544" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">문도윤</text><text x="154" y="544" font-size="14" fill="#03257B" font-weight="600" text-anchor="start">NULL · 책 없음</text><rect x="24" y="581" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="607" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">문도윤은 LEFT JOIN에서만 결과에 남아요</text><text x="24" y="651" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">작가 없는 필사본은 두 결과 모두에 없음</text></g></svg>