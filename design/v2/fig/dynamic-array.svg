<svg xmlns="http://www.w3.org/2000/svg" width="390" height="500" viewBox="0 0 390 500" role="img" aria-labelledby="title desc"><title id="title">동적 배열의 확장</title><desc id="desc">용량 4 배열에 다섯 번째 값 E를 넣기 위해 용량 8 배열을 새로 만들고 A, B, C, D를 복사한다. 확장 한 번은 O(n), append는 분할상환 O(1)이다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">가득 차면 더 넓게</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">새 배열을 만들고 기존 원소를 옮겨요</text><rect x="24" y="116" width="342" height="92" rx="8" fill="#FFFFFF" stroke="none"/><text x="42" y="141" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">용량 4 · 원소 4개</text><rect x="42" y="153" width="64" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="74.0" y="179.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="112" y="153" width="64" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="144.0" y="179.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">B</text><rect x="182" y="153" width="64" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="214.0" y="179.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">C</text><rect x="252" y="153" width="64" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="284.0" y="179.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">D</text><path d="M195 222 L195 266" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="211" y="249" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">복사 O(n)</text><rect x="24" y="282" width="342" height="117" rx="8" fill="#FFFFFF" stroke="none"/><text x="42" y="309" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">용량 8 · E 추가</text><rect x="45" y="328" width="34" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="62.0" y="354.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">A</text><rect x="83" y="328" width="34" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="100.0" y="354.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">B</text><rect x="121" y="328" width="34" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="138.0" y="354.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">C</text><rect x="159" y="328" width="34" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="176.0" y="354.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">D</text><rect x="197" y="328" width="34" height="42" rx="12" fill="#03257B" stroke="none"/><text x="214.0" y="354.0" font-size="16" fill="white" font-weight="600" text-anchor="middle">E</text><rect x="235" y="328" width="34" height="42" rx="12" fill="white" stroke="none"/><text x="252.0" y="354.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle"></text><rect x="273" y="328" width="34" height="42" rx="12" fill="white" stroke="none"/><text x="290.0" y="354.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle"></text><rect x="311" y="328" width="34" height="42" rx="12" fill="white" stroke="none"/><text x="328.0" y="354.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle"></text><rect x="24" y="423" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="449" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">append는 분할상환 O(1)</text></g></svg>