<svg xmlns="http://www.w3.org/2000/svg" width="390" height="576" viewBox="0 0 390 576" role="img" aria-labelledby="title desc"><title id="title">이진 탐색 트리 검색</title><desc id="desc">40, 20, 60, 10, 30, 50, 70으로 구성한 BST에서 30을 찾는다. 40보다 작아 왼쪽, 20보다 커 오른쪽, 30에서 성공한다. 균형이면 O(log n), 치우치면 O(n)이다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">자료구조 / DATA STRUCTURE</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">비교하면서 후보를 줄이기</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">찾는 값 30을 현재 노드와 비교해요</text><rect x="24" y="116" width="342" height="245" rx="8" fill="#FFFFFF" stroke="none"/><path d="M195 176 L110 219" fill="none" stroke="#0E5CF4" stroke-width="2" stroke-linecap="round"/><path d="M195 176 L280 219" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M110 255 L67 298" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M110 255 L153 298" fill="none" stroke="#0E5CF4" stroke-width="2" stroke-linecap="round"/><path d="M280 255 L237 298" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><path d="M280 255 L323 298" fill="none" stroke="#E5E8EB" stroke-width="2" stroke-linecap="round"/><circle cx="195" cy="158" r="21" fill="#03257B"/><text x="195" y="163" font-size="16" fill="white" font-weight="600" text-anchor="middle">40</text><circle cx="110" cy="237" r="21" fill="#03257B"/><text x="110" y="242" font-size="16" fill="white" font-weight="600" text-anchor="middle">20</text><circle cx="280" cy="237" r="21" fill="#EAF1FE"/><text x="280" y="242" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">60</text><circle cx="67" cy="316" r="21" fill="#EAF1FE"/><text x="67" y="321" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">10</text><circle cx="153" cy="316" r="21" fill="#03257B"/><text x="153" y="321" font-size="16" fill="white" font-weight="600" text-anchor="middle">30</text><circle cx="237" cy="316" r="21" fill="#EAF1FE"/><text x="237" y="321" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">50</text><circle cx="323" cy="316" r="21" fill="#EAF1FE"/><text x="323" y="321" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">70</text><rect x="24" y="385" width="100" height="45" rx="12" fill="#EAF1FE" stroke="none"/><text x="74.0" y="412.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">30 &lt; 40</text><path d="M133 407 L151 407" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="160" y="385" width="100" height="45" rx="12" fill="#EAF1FE" stroke="none"/><text x="210.0" y="412.5" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">30 &gt; 20</text><path d="M269 407 L286 407" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="294" y="385" width="72" height="45" rx="12" fill="#03257B" stroke="none"/><text x="330.0" y="412.5" font-size="14" fill="white" font-weight="600" text-anchor="middle">30 발견</text><rect x="24" y="455" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="481" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">균형이면 O(log n), 치우치면 O(n)</text><text x="24" y="527" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">정렬된 값 10 → 20 → 30 → 40 삽입 시</text><text x="24" y="550" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">오른쪽으로만 이어져 비교가 늘어나요</text></g></svg>