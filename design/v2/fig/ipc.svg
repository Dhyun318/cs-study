<svg xmlns="http://www.w3.org/2000/svg" width="390" height="578" viewBox="0 0 390 578" role="img" aria-labelledby="title desc"><title id="title">공유 메모리와 메시지 전달</title><desc id="desc">공유 메모리는 커널이 설정한 영역을 두 프로세스가 함께 매핑해 직접 읽고 쓰며 동기화가 필요하다. 메시지 전달은 send와 receive로 커널을 거쳐 데이터를 주고받는다.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#6194F8" stroke-width="1.5" stroke-linejoin="round"/></marker></defs><g font-family="Pretendard, -apple-system, sans-serif"><text x="24" y="32" font-size="14" fill="#0E5CF4" font-weight="600" text-anchor="start">OPERATING SYSTEM</text><text x="24" y="65" font-size="24" fill="#03257B" font-weight="700" text-anchor="start">프로세스 사이의 두 통로</text><text x="24" y="89" font-size="14" fill="#4E5968" font-weight="600" text-anchor="start">격리된 주소 공간을 IPC로 연결해요</text><rect x="24" y="117" width="342" height="178" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="146" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">01  공유 메모리</text><rect x="44" y="164" width="114" height="43" rx="12" fill="#03257B" stroke="none"/><text x="101.0" y="190.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">Process A</text><rect x="232" y="164" width="114" height="43" rx="12" fill="#03257B" stroke="none"/><text x="289.0" y="190.5" font-size="16" fill="white" font-weight="600" text-anchor="middle">Process B</text><rect x="96" y="231" width="198" height="42" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="257.0" font-size="16" fill="#03257B" font-weight="600" text-anchor="middle">함께 매핑한 영역</text><path d="M100 211 L145 226" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M288 211 L245 226" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="24" y="322" width="342" height="161" rx="8" fill="#FFFFFF" stroke="none"/><text x="44" y="351" font-size="16" fill="#03257B" font-weight="600" text-anchor="start">02  메시지 전달</text><rect x="42" y="374" width="91" height="44" rx="12" fill="#03257B" stroke="none"/><text x="87.5" y="401.0" font-size="14" fill="white" font-weight="600" text-anchor="middle">A · send</text><rect x="153" y="374" width="84" height="44" rx="12" fill="#EAF1FE" stroke="none"/><text x="195.0" y="401.0" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">커널</text><rect x="257" y="374" width="91" height="44" rx="12" fill="#03257B" stroke="none"/><text x="302.5" y="401.0" font-size="14" fill="white" font-weight="600" text-anchor="middle">B · recv</text><path d="M136 396 L149 396" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M240 396 L253 396" fill="none" stroke="#6194F8" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><text x="195" y="455" font-size="14" fill="#4E5968" font-weight="600" text-anchor="middle">pipe · socket · message queue</text><rect x="24" y="511" width="342" height="42" rx="14" fill="#FFE0B0" stroke="none"/><text x="195" y="537" font-size="14" fill="#03257B" font-weight="600" text-anchor="middle">공유 메모리는 설정 뒤 직접 접근 · 동기화 필요</text></g></svg>